# Ducktape call test-bed: a reproducible two-validator network that carries a
# real voice call, with a driver that self-verifies audio crosses the mesh.
#
#   docker compose -f ops/callbed/docker-compose.yml build
#   docker compose -f ops/callbed/docker-compose.yml run --rm driver
#
# `run --rm driver` resolves the dependency chain in order (bootstrap runs to
# completion, node0+node1 come up and reach a live 2-of-2 quorum, THEN the
# driver runs) and exits with the driver's code. Do NOT use
# `up --abort-on-container-exit`: the one-shot `bootstrap` exits first and would
# tear the whole stack down before the nodes start.
#
# The `driver` exits 0 iff a synthesized tone crosses BOTH directions (see
# call-driver.ts). node0's call/status surface is also published on the host
# (127.0.0.1:8080) so you can curl /v1/status or point another driver at it.
#
# Driving the REAL desktop app (with a PulseAudio virtual mic) against this
# network is a documented follow-up: see README.md "The app profile" and
# virtual-mic.sh. It is deliberately NOT a service here because the app manages
# its own node, and video can't render under WebKitGTK anyway (no WebCodecs).
name: ducktape-callbed

x-node-health: &node-health
  # height >= 1 means the node is up, identity-loaded, AND in a live 2-of-2
  # quorum (a lone un-peered validator can't finalize past genesis) — so the
  # driver only starts once the two nodes have actually meshed.
  test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/status | grep -qE '\"height\":[1-9]'"]
  interval: 3s
  timeout: 3s
  retries: 40

services:
  # one-shot: run the peering ceremony, write node0/node1 configs, exit 0.
  bootstrap:
    build:
      context: ../..
      dockerfile: ops/callbed/Dockerfile.node
    image: ducktape-callbed-node
    command: ["/usr/local/bin/bootstrap.sh"]
    volumes:
      - shared:/shared

  node0:
    image: ducktape-callbed-node
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["/usr/local/bin/node-entry.sh", "/shared/node0"]
    volumes:
      - shared:/shared
    ports:
      - "127.0.0.1:8080:8080" # /v1/call/ws + /v1/status on the host
    healthcheck: *node-health

  node1:
    image: ducktape-callbed-node
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["/usr/local/bin/node-entry.sh", "/shared/node1"]
    volumes:
      - shared:/shared
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck: *node-health

  # the self-check: synthesize a tone on each node, assert it plays out of the
  # other. Exits 0 on success; use `--abort-on-container-exit driver` so
  # `docker compose up` returns the driver's exit code.
  driver:
    image: oven/bun:1
    depends_on:
      node0:
        condition: service_healthy
      node1:
        condition: service_healthy
    environment:
      SETTLE_MS: "1500" # give the mesh a beat to peer before measuring
    volumes:
      - ./call-driver.ts:/work/call-driver.ts:ro
    working_dir: /work
    command: ["bun", "call-driver.ts", "node0:8080", "node1:8080"]

volumes:
  shared: {}
