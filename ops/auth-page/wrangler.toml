# The WebAuthn relying-party origin. Static files only, no Worker code.
#   npx wrangler@4 login && npx wrangler@4 deploy --config ops/auth-page/wrangler.toml
# `custom_domain = true` makes wrangler create the DNS record and the
# certificate for the hostname in the same account's zone.
name = "ducktape-auth"
compatibility_date = "2026-08-01"
assets = { directory = "." }   # index.html only; .assetsignore drops the rest
routes = [{ pattern = "auth.ducktape.byeongsu.dev", custom_domain = true }]
