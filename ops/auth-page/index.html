<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ducktape auth</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #222; }
  button { font: inherit; padding: .6rem 1.2rem; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 1rem; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>ducktape</h1>
<p id="what"></p>
<button id="go" hidden></button>
<pre id="out" hidden></pre>
<form id="cb" method="post" hidden><input type="hidden" name="result"></form>

<!-- Pure helpers: no DOM, no WebAuthn. `test.mjs` lifts this block out and runs it under node. -->
<script id="pure">
const pure = {
  b64u: {
    enc(bytes) {
      let s = "";
      for (const b of bytes) s += String.fromCharCode(b);
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    },
    dec(str) {
      const pad = "=".repeat((4 - (str.length % 4)) % 4);
      const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/") + pad);
      return Uint8Array.from(bin, (c) => c.charCodeAt(0));
    },
  },

  hex(bytes) {
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  },

  // The request rides in the URL fragment so it never reaches a server log.
  // See README.md for the contract.
  parseRequest(fragment) {
    const p = new URLSearchParams(fragment.replace(/^#/, ""));
    const get = (k) => {
      const v = p.get(k);
      if (v === null || v === "") throw new Error(`missing ${k}`);
      return v;
    };
    const op = get("op");
    const req = { op, challenge: pure.b64u.dec(get("challenge")), cb: pure.loopbackOnly(p.get("cb")) };
    if (op === "create") {
      req.user = pure.b64u.dec(get("user"));
      if (req.user.length !== 8) throw new Error("user must be the 8-byte LE account number");
      req.name = get("name");
    } else if (op !== "get" && op !== "eth") {
      throw new Error(`unknown op ${op}`);
    }
    return req;
  },

  // The result (a signature the chain will accept) only ever goes to the
  // app/CLI listener on this machine — a crafted link cannot relay it elsewhere.
  loopbackOnly(cb) {
    if (cb === null) return null;
    const url = new URL(cb);
    const isLoopback = url.protocol === "http:" && ["127.0.0.1", "[::1]", "localhost"].includes(url.hostname);
    if (!isLoopback) throw new Error("cb must be http://127.0.0.1, [::1] or localhost");
    return url.href;
  },

  // `getPublicKey()` returns SPKI DER; for P-256 the uncompressed point is the
  // last 65 bytes (0x04 ‖ X ‖ Y). Returns the 33-byte compressed SEC1 point.
  spkiToSec1(spki) {
    const point = spki.slice(spki.length - 65);
    if (point[0] !== 0x04) throw new Error("not an uncompressed P-256 point");
    const x = point.slice(1, 33);
    const y = point.slice(33, 65);
    const out = new Uint8Array(33);
    out[0] = 0x02 | (y[31] & 1);
    out.set(x, 1);
    return out;
  },

  // WebAuthn ES256 signatures are DER `SEQUENCE { INTEGER r, INTEGER s }`;
  // the keyscheme envelope wants raw `R ‖ S` (32 ‖ 32).
  derToRawSig(der) {
    if (der[0] !== 0x30) throw new Error("not a DER sequence");
    let i = 2;
    const int = () => {
      if (der[i++] !== 0x02) throw new Error("not a DER integer");
      let len = der[i++];
      let start = i;
      i += len;
      while (len > 32 && der[start] === 0) {
        start++;
        len--;
      }
      if (len > 32) throw new Error("integer wider than 32 bytes");
      const out = new Uint8Array(32);
      out.set(der.slice(start, start + len), 32 - len);
      return out;
    };
    const r = int();
    const s = int();
    const out = new Uint8Array(64);
    out.set(r, 0);
    out.set(s, 32);
    return out;
  },
};
</script>

<script>
const { b64u, hex, parseRequest, spkiToSec1, derToRawSig } = pure;
const $ = (id) => document.getElementById(id);
const rpId = location.hostname;

const OPS = {
  async create(req) {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { id: rpId, name: "ducktape" },
      user: { id: req.user, name: req.name, displayName: req.name },
      challenge: req.challenge,
      pubKeyCredParams: [{ type: "public-key", alg: -7 }],
      authenticatorSelection: { residentKey: "required", userVerification: "preferred" },
      attestation: "none",
    } });
    const r = cred.response;
    return {
      op: "create",
      credentialId: b64u.enc(new Uint8Array(cred.rawId)),
      publicKey: b64u.enc(spkiToSec1(new Uint8Array(r.getPublicKey()))),
      alg: r.getPublicKeyAlgorithm(),
      attestationObject: b64u.enc(new Uint8Array(r.attestationObject)),
      clientDataJSON: b64u.enc(new Uint8Array(r.clientDataJSON)),
    };
  },
  async get(req) {
    const cred = await navigator.credentials.get({ publicKey: {
      rpId,
      challenge: req.challenge,
      allowCredentials: [],
      userVerification: "preferred",
    } });
    const r = cred.response;
    return {
      op: "get",
      credentialId: b64u.enc(new Uint8Array(cred.rawId)),
      authenticatorData: b64u.enc(new Uint8Array(r.authenticatorData)),
      clientDataJSON: b64u.enc(new Uint8Array(r.clientDataJSON)),
      signature: b64u.enc(derToRawSig(new Uint8Array(r.signature))),
      userHandle: r.userHandle ? b64u.enc(new Uint8Array(r.userHandle)) : null,
    };
  },
  async eth(req) {
    if (!window.ethereum) throw new DOMException("no wallet found (window.ethereum)", "NotFoundError");
    const [address] = await window.ethereum.request({ method: "eth_requestAccounts" });
    const signature = await window.ethereum.request({
      method: "personal_sign",
      params: ["0x" + hex(req.challenge), address],
    });
    return { op: "eth", address, signature, message: b64u.enc(req.challenge) };
  },
};

const LABEL = {
  create: "Register a passkey for this ducktape account",
  get: "Sign in with a passkey (use your phone if it lives there)",
  eth: "Sign with your Ethereum wallet",
};

function deliver(req, result) {
  const json = JSON.stringify(result);
  if (!req.cb) {
    $("out").textContent = json;
    $("out").hidden = false;
    return;
  }
  // A top-level form POST to the loopback listener: no CORS, no preflight,
  // no Chrome local-network-access prompt — the `gh auth login` shape.
  const form = $("cb");
  form.action = req.cb;
  form.result.value = json;
  form.submit();
}

function fail(e) {
  $("what").textContent = e.message || String(e);
  $("what").className = "err";
  $("go").hidden = true;
}

try {
  const req = parseRequest(location.hash);
  $("what").textContent = LABEL[req.op];
  const go = $("go");
  go.textContent = "Continue";
  go.hidden = false;
  go.onclick = () =>
    OPS[req.op](req)
      .then((r) => deliver(req, r))
      .catch((e) => {
        fail(e);
        deliver(req, { op: req.op, error: e.name || "Error", message: e.message || String(e) });
      });
} catch (e) {
  fail(e);
}
</script>
</body>
</html>
