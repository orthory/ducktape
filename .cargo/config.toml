# fetch git dependencies (fluent31) with the git CLI instead of libgit2:
# a `url.insteadOf` rewrite to ssh breaks cargo's built-in fetcher, while the
# real git binary picks up the usual ssh agent/keys.
[net]
git-fetch-with-cli = true

# Do NOT try -Zincremental-ignore-spans (via RUSTC_BOOTSTRAP=1) to speed up
# the .ice edit loop. It briefly delivered ~1 s edits, then poisoned the
# incremental caches deterministically on rustc 1.96.1: every later compile
# ICEs loading the dep graph ("A dep graph node
# (explicit_supertraits_containing_assoc_item) does not have an unique
# index"), reproduced in two independent target dirs with the same node
# hash. The real fix for span-shift rebuild storms is splitting the
# generated UI file per source fragment: byeongsu-hong/ducktape-ui#374.

# The dev bin links in ~25-28 s of every edit-run loop (measured: a 13-object
# incremental rebuild and a 23-object one both took ~33 s wall — the cost is
# the LINK, not codegen). mold cuts it; scoped to x86_64-linux so the mac
# builds are untouched. Needs the ld.mold shim on PATH (~/.local/bin).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
