[package]
name = "duckdns-client"
edition.workspace = true
version.workspace = true

# OS-side DuckDNS publication/proxy layer. Consensus never sees this crate's
# loopback targets; shared names and wire types come from duckdns-core.
[dependencies]
duckdns-core = { workspace = true }
duckfs-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
http = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
