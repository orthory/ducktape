[package]
name = "authpage"
edition.workspace = true
version.workspace = true

# the CLIENT half of the WebAuthn relying-party page (`ops/auth-page`): the
# request URL the app/CLI opens the system browser to, the one-shot loopback
# listener the page POSTs its result to, the result JSON, and the frame /
# consent builders a passkey or an Ethereum wallet completes. No node I/O —
# the CLI and the app sequence the ceremonies around their own queries.
[dependencies]
keyscheme = { workspace = true }
node = { workspace = true }
identity = { workspace = true }
sdk = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
# the relay poll (`Relay::wait`) — blocking, like the listener it sits beside.
reqwest = { workspace = true }

[dev-dependencies]
keyscheme = { workspace = true, features = ["testkit"] }
