# The module SDK: everything a wasm module is authored against, in one crate a
# module pins by git revision. It generates the `ducktape:module` bindings once
# (the WIT world is `wit/module.wit`, right here), exports the macro a guest
# invokes, adapts the host imports to the `sdk::Ctx` a native module expects,
# and re-exports `sdk` — so a module's logic is single-sourced in its crate and
# the guest is one file. The wasm32 patch crates every guest graph needs
# (`stubs/`: deterministic `getrandom` refusals, a C-free `blst`) live beside
# it; a module's build patches them in through this repository as a git source.
#
# Standalone workspace, never a member of the root: it compiles only for
# `wasm32-unknown-unknown`, inside the shell workspace guest-builder synthesizes
# (an in-tree module) or a module author's own cdylib crate (an out-of-tree
# one). `stubs/` is excluded so each patch crate stays its own root.
[package]
name = "ducktape-module-sdk"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# the duckfs object-store adapter (`GuestOdb`). non-default so the guests
# that never touch the object plane don't compile `duckfs-core`; the files
# guest enables it.
odb = ["dep:duckfs-core"]

[dependencies]
wit-bindgen = "0.57"
sdk = { path = "../kernel/sdk" }
async-trait = "0.1"
duckfs-core = { path = "../duckfs/core", optional = true }

[workspace]
exclude = ["stubs"]
