# The getrandom 0.3 twin of ./getrandom-02 (which covers 0.2), SHARED by every
# wasm guest via [patch.crates-io]. Consolidated from byte-identical per-guest
# copies; componentized guest bytes are unchanged. The
# commonware-cryptography 2026.7 bump pulled getrandom 0.3 (via ahash and
# rand_core 0.9) and 0.4 into the guest graph, and each major's real wasm32
# backend ("wasm_js") bakes unstrippable `__wbindgen_placeholder__` imports
# into the cdylib, which `wasm-tools component new` rightly refuses. same
# ruling as 0.2: no consensus path may ever observe entropy, so the only
# correct guest backend is a deterministic refusal.
[package]
name = "getrandom"
version = "0.3.4"
edition = "2021"
publish = false

# feature names dependents may enable must exist; all inert — the stub has
# exactly one backend: a deterministic refusal.
[features]
default = []
std = []
wasm_js = []
sys_rng = []

[workspace]
