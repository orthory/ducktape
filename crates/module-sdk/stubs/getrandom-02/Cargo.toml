# A deterministic stand-in for `getrandom` 0.2, SHARED by every wasm guest
# build (each guest wires it via `[patch.crates-io]` at ../stubs/getrandom-02,
# so it applies only to the standalone guest workspaces — native builds keep
# the real crate). Consolidated here from per-guest copies; the source is
# byte-identical, so componentized guest bytes are unchanged.
#
# WHY: a guest's dependency tree (commonware-cryptography, p256's rand_core,
# ...) enables getrandom's "js" backend on
# wasm32-unknown-unknown, which compiles wasm-bindgen shims into the cdylib as
# unstrippable `__wbindgen_placeholder__` imports — and `wasm-tools component
# new` (rightly) refuses a module importing an interface the ducktape:module
# world does not declare. no consensus code path ever CALLS getrandom (modules
# are deterministic by contract; the guest only reaches valset's pure wire
# types), so the correct guest backend is one that exists to link and fails
# deterministically if anything ever does call it: ambient entropy inside a
# guest would be a consensus fork, never a feature.
[package]
name = "getrandom"
version = "0.2.17"
edition = "2021"
publish = false

# feature names dependents may enable must exist; they are all inert here —
# the stub has exactly one backend: a deterministic refusal.
[features]
default = []
std = []
js = ["js-sys", "wasm-bindgen"]
js-sys = []
wasm-bindgen = []
custom = []
rdrand = []
test-in-browser = []

[workspace]
