[package]
name = "blobstore"
edition.workspace = true
version.workspace = true

# the daemon's node-local op-receipt blob store: op payloads staged at submit
# time and served back over the http blob route. shared by node, noded, simnode
# and the forge module — never consensus state, never in any root.
#
# NOT a consensus module — no `sdk::Module` impl, no MODULE_ID, no guest wasm,
# not in `host::topology`. It sat under crates/modules/system/ labelled a
# "host-side counterpart", which is just the offchain side spelled differently;
# it is platform infrastructure of exactly `indexer`'s kind (node-local, in no
# root), so it lives beside it under crates/kernel/.
[features]
# exposes the in-memory `MemBlobs` sim arm to non-test consumers (data-plane
# `sim`-feature precedent). always on under `cfg(test)`.
sim = []

[dependencies]
sha2 = { workspace = true }
# `ducktape::blobstore`: a persist failure and a content-hash mismatch are the
# two faults this store can see, and an `eprintln!` reached neither sink.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
