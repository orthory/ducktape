# the derived read-model tier: per-module fluent31 databases holding the
# host-written op feed, folded by each module's own wasm index guest inside
# the engine. domain-agnostic by design — this crate must never depend on
# `sdk`, `host`, or any module crate; the node layer maps its block outcomes
# into this crate's plain-data input types and hands it the guest artifacts
# as opaque bytes.
[package]
name = "indexer"
version.workspace = true
edition.workspace = true

[dependencies]
borsh = { workspace = true }
# the wasm feature IS this tier's fold engine: installed index guests +
# changes-mode triggers + the view query role.
fluent31 = { workspace = true, features = ["wasm"] }
index_guest = { workspace = true }
serde = { workspace = true }
# the guest-converge marker hashes artifact bytes so warm boots skip compiles.
sha2 = { workspace = true }
thiserror = { workspace = true }

[features]
# the mem arm of the disk seam (`MemDisk`) for driving the shipping lane on a
# mock filesystem. always on under `cfg(test)`; this exposes it to downstream
# sim/test consumers too. no runtime deps — the arm is pure in-memory maps.
sim = []

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
