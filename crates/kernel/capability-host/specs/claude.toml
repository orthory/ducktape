# Capability spec: Claude Code CLI.
#
# Embedded built-in default — see codex.toml for the annotated reference and
# docs/capability-spec.md for the full format. The BASE tag ("claude") passes
# no --model flag: which model runs is the operator's CLI configuration (host
# policy). The [[variants]] below are the curated model/effort matrix — each
# expands at load time into a finer tag `claude_<model>_<effort>` carrying
# its own fully literal argv (base args + --model/--effort), overridable
# per tag like any other spec.

spec = 1

[capability]
tag = "claude"
description = "Claude Code CLI, non-interactive print mode (BYO auth: the CLI manages its own login)"

[detect]
bin = "claude"
env = "DUCKTAPE_CLAUDE_BIN"

[invoke]
# Print mode with a single JSON result object; one turn so the agent answers
# instead of embarking on tool-use loops. Prompt arrives on stdin.
args = [
    "-p",
    "--output-format",
    "json",
    "--max-turns",
    "1",
]
prompt = "stdin"
timeout_secs = 300

[output]
# The single `{"type":"result",...}` object from --output-format json.
format = "json-result"

# ---- curated model/effort matrix -------------------------------------------
# Base args plus an explicit --model and --effort per variant.

[[variants]]
suffix = "fable_low"
args = ["-p", "--output-format", "json", "--max-turns", "1", "--model", "fable", "--effort", "low"]

[[variants]]
suffix = "fable_medium"
args = ["-p", "--output-format", "json", "--max-turns", "1", "--model", "fable", "--effort", "medium"]

[[variants]]
suffix = "fable_high"
args = ["-p", "--output-format", "json", "--max-turns", "1", "--model", "fable", "--effort", "high"]

[[variants]]
suffix = "fable_max"
args = ["-p", "--output-format", "json", "--max-turns", "1", "--model", "fable", "--effort", "max"]

[[variants]]
suffix = "opus_low"
args = ["-p", "--output-format", "json", "--max-turns", "1", "--model", "opus", "--effort", "low"]

[[variants]]
suffix = "opus_medium"
args = ["-p", "--output-format", "json", "--max-turns", "1", "--model", "opus", "--effort", "medium"]

[[variants]]
