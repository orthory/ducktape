# Capability spec: OpenAI Codex CLI.
#
# This file is EMBEDDED in the capability-host crate as a built-in default and
# parsed by the exact same code path as operator-provided specs — it is the
# reference example of the format. An operator spec with `tag = "codex"` in
# $DUCKTAPE_CAPABILITY_DIR overrides this file entirely (no field merging);
# each [[variants]] tag below is its own tag and is overridden the same way.
#
# Which MODEL codex runs is host policy, not consensus data. The BASE tag
# ("codex") passes no --model flag, so the CLI uses whatever the operator
# configured in codex itself. The [[variants]] below are the curated
# model/effort matrix: each one is load-time expansion into a finer tag
# `codex_<model>_<effort>` with its own fully literal argv (no placeholders,
# no dispatch-time routing) — exactly as if each were its own spec file.
#
# Format reference: docs/capability-spec.md

spec = 1

[capability]
tag = "codex"
description = "OpenAI Codex CLI, non-interactive one-shot exec mode (BYO auth: the CLI manages its own login)"

[detect]
# Probed on PATH; DUCKTAPE_CODEX_BIN points at an explicit binary instead
# (an explicit override that does not exist is a loud warning + absent
# capability, never a silent fallback to PATH).
bin = "codex"
env = "DUCKTAPE_CODEX_BIN"

[invoke]
# One-shot exec, most-restricted sandbox, machine-readable event stream.
# The trailing "-" tells codex to read the prompt from stdin (fed
# concurrently, then EOF). Args are fully literal — no placeholders.
args = [
    "exec",
    "--json",
    "--sandbox",
    "read-only",
    "--skip-git-repo-check",
    "-",
]
prompt = "stdin"
timeout_secs = 300

[output]
# The `codex exec --json` JSONL event stream: the LAST agent_message wins.
format = "jsonl-events"

# ---- curated model/effort matrix -------------------------------------------
# Each variant pins the model with -m and the reasoning effort with -c. The
# -c value deliberately carries embedded double quotes ('...="low"'): codex
# parses the value as TOML, and argv goes straight to exec — no shell ever
# sees it. The trailing "-" (prompt from stdin) stays LAST.

[[variants]]
suffix = "gpt-5.5_low"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5", "-c", 'model_reasoning_effort="low"', "-"]

[[variants]]
suffix = "gpt-5.5_medium"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5", "-c", 'model_reasoning_effort="medium"', "-"]

[[variants]]
suffix = "gpt-5.5_high"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5", "-c", 'model_reasoning_effort="high"', "-"]

[[variants]]
suffix = "gpt-5.5_xhigh"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5", "-c", 'model_reasoning_effort="xhigh"', "-"]

[[variants]]
suffix = "gpt-5.5-codex_low"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5-codex", "-c", 'model_reasoning_effort="low"', "-"]

[[variants]]
suffix = "gpt-5.5-codex_medium"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5-codex", "-c", 'model_reasoning_effort="medium"', "-"]

[[variants]]
suffix = "gpt-5.5-codex_high"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5-codex", "-c", 'model_reasoning_effort="high"', "-"]

[[variants]]
suffix = "gpt-5.5-codex_xhigh"
args = ["exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-m", "gpt-5.5-codex", "-c", 'model_reasoning_effort="xhigh"', "-"]
