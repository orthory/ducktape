[package]
name = "node"
edition.workspace = true
version.workspace = true

# the replication layer: wraps a `host::Host` with an ordering seam
# (`Orderer` + `RoundOrderer`, agreed total order) so N validators apply a
# totally-ordered op stream identically. a msg is NOT applied on submit; it is
# proposed into an agreed order and applied via host.submit ONLY when the order
# delivers it, identically on every validator. this is what makes an
# order-DEPENDENT qmdb root converge.
# depends on sdk (Msg) + host (the state machine); the wire codec lives here so
# sdk stays dep-clean. the real commonware simplex orderer is a later slice; it
# is the drop-in behind the same `Orderer` trait.
[dependencies]
sdk = { workspace = true }
host = { workspace = true }
thiserror = { workspace = true }
# op frames are ed25519-SIGNED: encode signs, decode verifies, so the host's
# Origin::External is authenticated authorship.
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }

[dev-dependencies]
# the host-side qmdb store handle injected into disk-backed modules.
statesync = { workspace = true }
# tests stand hosts over in-memory directory modules and drive the async seams
# on a plain futures executor.
directory = { workspace = true }
futures = "0.3"
# the agreed-order convergence test stands N validators, each a host with a
# qmdb-backed kv module (order-DEPENDENT root), on the deterministic runtime.
kv = { workspace = true }
# the oracle-over-consensus test: a saga tracker module + a mock worker prove an
# async saga settles to Done when the OracleResult op finalizes on every node.
saga = { workspace = true }
# a probe module (impl sdk::Module) in the env-from-view test needs async-trait.
async-trait = { workspace = true }
commonware-runtime = { workspace = true }
