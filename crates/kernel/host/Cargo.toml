[package]
name = "host"
edition.workspace = true
version.workspace = true

# the deterministic state-machine spine: a module registry, the dispatch +
# local-only follow-up drain, and app-hash composition over the registered
# modules (`global_root` — sha2 is its one hashing dep). depends on sdk (the
# contract); it knows nothing of any concrete module beyond `dyn Module`.
[dependencies]
sdk = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# WIRE-TYPES-ONLY dep: `Host::effective_version` decodes the upgrade module's
# `Status` reply and applies the shared version derivation. host uses only
# the crate-root wire types — it never constructs or registers the module impl
# (same shape as governance reading valset's wire types).
upgrade = { workspace = true }
# WIRE-TYPES-ONLY dep, same shape: the drain's delivery injection reads
# the dispatch module's committed mailbox count between blocks.
dispatch = { workspace = true }

[dev-dependencies]
# the end-to-end test stands a real qmdb-backed module on the deterministic
# runtime and drives it through the host.
kv = { workspace = true }
directory = { workspace = true }
greeter = { workspace = true }
# the deterministic-activation drain-injection test stands the real upgrade +
# valset modules on the host and drives a block across an activation boundary.
valset = { workspace = true }
# the delivery drain-injection test stands the real dispatch + saga modules
# next to a stub receiver.
saga = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-runtime = { workspace = true }
serde_json = "1"
# the boundary-fault tests drive stub modules on a plain futures executor.
futures = "0.3"
