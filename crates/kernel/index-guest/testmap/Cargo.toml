# the reference index mapper: the smallest real fold + view, proving the
# index-guest authoring surface and the engine pipeline end-to-end. its built
# artifact (index.wasm, committed beside this manifest) is the fixture the
# indexer crate's tests install; `make wasm-modules` refreshes it through
# guest-builder --index like every other guest artifact.
#
# standalone [workspace] ON PURPOSE — guests never join the host workspace
# (membership poisons native feature unification).
[package]
name = "testmap"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# the default (pure) surface is unconditional — the decision core and its
# native unit tests live on it. the `index-guest` feature only ADDS the wasm
# shell half, exactly what guest-builder --index enables.
index_guest = { path = "..", package = "index-guest" }

[features]
index-guest = ["index_guest/guest"]

[workspace]
