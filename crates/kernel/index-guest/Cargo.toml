# the ducktape index-guest contract: the borsh op-row envelope every fold feed
# carries (host encodes, guests decode) plus — behind `guest` — the wasm32
# authoring surface for per-module index mappers (ducktape-named wrappers over
# fluent31's guest SDK). host builds use the default (types-only) surface;
# only guest-builder's synthesized wasm32 workspaces enable `guest`.
[package]
name = "index-guest"
version.workspace = true
edition.workspace = true

[dependencies]
borsh = { workspace = true }
serde = { workspace = true }
fluent-guest = { workspace = true, optional = true }

[features]
# the authoring half: fluent-guest re-exports, the fold!/view! entry macros,
# the op-feed decoder, and the posting-list search helpers. NEVER enabled by a
# host-side dependent — the ABI it wraps exists only inside the engine.
guest = ["dep:fluent-guest"]
