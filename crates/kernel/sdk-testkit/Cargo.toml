[package]
name = "sdk-testkit"
edition.workspace = true
version.workspace = true

# dev-only shared test doubles for the sdk boundary traits: `TestCtx`
# (a programmable `sdk::Ctx`) and `MemStore` (an in-memory `sdk::MerkleStore`).
# these replace the ~30 hand-rolled copies scattered across module test suites.
# consumed as a `[dev-dependencies]` ONLY — never a runtime dep, so the Module
# Rule (a module links only sdk + wire surfaces) is untouched.
[dependencies]
sdk = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
