[package]
name = "files"
edition.workspace = true
version.workspace = true

# the files module: content-addressed manifests in consensus state, chunk bytes
# in a node-local blob store served peer-to-peer (the NoKV metadata/body split).
[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# the node-local body store (chunk bytes off consensus): the daemon's op-receipt
# lane, owned by the `blobstore` crate and shared with noded + forge.
blobstore = { workspace = true }

[dev-dependencies]
futures = "0.3"
host = { workspace = true }
sha2 = { workspace = true }
