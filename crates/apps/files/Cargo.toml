[package]
name = "files"
edition.workspace = true
version.workspace = true

# duckfs: a consensus-replicated, copy-on-write, content-addressed filesystem
# module. ONE crate with the pure core always compiled (the future wasm unit);
# the `native` feature (default) adds the disk stores and the sdk module glue.
# purity gate: `cargo check -p files --no-default-features` must stay green.
[features]
default = ["native"]
native = ["dep:sdk", "dep:async-trait"]

[dependencies]
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
unicode-normalization = { workspace = true }
sdk = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
futures = "0.3"
tempfile = { workspace = true }
