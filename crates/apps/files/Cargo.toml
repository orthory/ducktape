[package]
name = "files"
edition.workspace = true
version.workspace = true

# Ducktape module adapter for duckfs. The reusable deterministic state machine
# lives in duckfs-core; disk persistence lives in duckfs-disk. `files` keeps the
# consensus module id and SDK capability glue, plus a compatibility re-export.
[features]
default = ["native"]
native = ["dep:duckfs-disk", "dep:sdk", "dep:async-trait", "dep:base64", "dep:serde_json"]

[dependencies]
duckfs-core = { workspace = true }
duckfs-disk = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sdk = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
# the host e2e + cross-host determinism suite stands the real `Files` module on
# the deterministic kernel host and drives it through `submit_at`/`query`.
host = { workspace = true }
futures = "0.3"
tempfile = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
