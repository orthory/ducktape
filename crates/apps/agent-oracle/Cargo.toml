[package]
name = "agent-oracle"
edition.workspace = true
version.workspace = true

# production host-side LLM oracle worker for agent saga WorkerRequest effects.
# runs the operator's locally installed executor CLIs via capability-host —
# NO direct provider API calls, NO credential handling in this crate.
[dependencies]
agent-interface = { workspace = true }
async-trait = { workspace = true }
capability-host = { workspace = true }
chat-interface = { workspace = true }
files = { workspace = true }
reactor = { workspace = true }
saga-interface = { workspace = true }
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
futures = "0.3"
tokio = { workspace = true, features = ["rt", "macros"] }
