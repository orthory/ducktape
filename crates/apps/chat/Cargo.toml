[package]
name = "chat"
edition.workspace = true
version.workspace = true

# the chat module: block-based channels, threads, edits, reactions, membership,
# and hook notifications on one host-injected merkle store.
[dependencies]
sdk = { workspace = true }
indexer = { workspace = true }
# types-only: the tag-report edge (chat translates its shapes, the plane routes).
tagging = { workspace = true }
async-trait = { workspace = true }
# NFC label normalization for the derived tag index (src/index/tags.rs).
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# the logical-key -> store-key hash (sha256); the store itself is injected.
sha2 = { workspace = true }
# voice submodule (crates/apps/chat/src/voice): real-time media over the data
# plane's datagram class. Off-consensus — no qmdb, no app-hash.
data-plane = { workspace = true }
opus-rs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
host = { workspace = true }
# the tests drive the module the way a host does: construct the concrete
# QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }
# the voice e2e proofs drive the data plane's deterministic sim transport.
data-plane = { workspace = true, features = ["sim"] }
