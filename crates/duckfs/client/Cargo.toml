[package]
name = "duckfs-client"
edition.workspace = true
version.workspace = true

# the OS-side checkout/commit engine for duckfs: chunk hashing, the versioned
# .duckfs index, worktree scan/status, change planning, and the synchronous
# NodeApi transport seam. consensus never sees this crate — it lives strictly on
# the client side of the wire (spec: the determinism boundary). duckfs-core
# supplies the wire types, object hashing, and path canonicalization so a client
# id is byte-identical to what a validator derives.
[dependencies]
duckfs-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
# `.duckfsignore` pattern matching. glob is already in the tree (a transitive
# dep) and `matches_with(require_literal_separator)` IS gitignore's `*`-stops-at-
# a-slash rule — a hand-rolled matcher would be the same semantics, badly.
glob = "0.3"

[dev-dependencies]
# the mock NodeApi stands a REAL native `files::Files` on a tempdir, so the tests
# pull in the module glue (native feature) plus the block_on drivers.
files = { path = "../../modules/apps/files" }
sdk = { workspace = true }
tempfile = { workspace = true }
futures = "0.3"
async-trait = { workspace = true }
sdk-testkit = { workspace = true }
