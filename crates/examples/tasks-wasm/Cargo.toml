# The wasm port of the `tasks` module: compiles the NATIVE tasks crate to
# wasm32 and adapts it to the ducktape:module world through guest-adapter —
# the module's logic stays single-sourced in `crates/apps/tasks`. Standalone
# workspace: guest crates build to `wasm32-unknown-unknown` and are
# componentized by the module build target, never by the host workspace.
# `default-features = false` drops the `native` feature's node-local derived
# index (its `indexer` dep drags unix-only IO); the consensus state machine
# and sdk::Module impl compile unconditionally, so the port loses nothing
# consensus-visible.
[package]
name = "tasks-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
guest-adapter = { path = "../guest-adapter" }
tasks = { path = "../../apps/tasks", default-features = false }
sdk = { path = "../../kernel/sdk" }

[workspace]
