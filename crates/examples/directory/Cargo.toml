[package]
name = "directory"
edition.workspace = true
version.workspace = true

# the wire surface always compiles; the native sdk Module implementation rides
# the `native` feature. `default-features = false` is the dependency shape the
# wasm guest port takes (wire types single-sourced, no sdk in the guest).
[features]
default = ["native"]
native = ["dep:sdk", "dep:sha2", "dep:async-trait"]
# the wasm-guest port (src/guest.rs): the dispatch shell over ducktape-module-sdk.
# non-default and wasm-only — enabled solely by the guest-builder's
# synthesized cdylib workspace, never by the native gate.
guest = ["dep:ducktape-module-sdk"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
futures = "0.3"
sdk-testkit = { workspace = true }
