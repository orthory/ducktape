# the desktop app's design system: the ONE place font identity, the type
# scale, and depth (surface + shadow) recipes live. every UI element pulls
# from here — swapping a face or a scale step is an edit to this crate, and
# the app's drift-guard tests hold the .ice sources to these values.
[package]
name = "design"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
# the app's EXACT iced pin: iced refuses to build without a platform (x11)
# and an executor (tokio), so the honest minimum is the app's own set — and
# matching it keeps the workspace compiling iced exactly once.
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tokio", "wgpu", "x11"] }
