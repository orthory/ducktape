[package]
name = "sandbox-host"
edition.workspace = true
version.workspace = true

# the shared sandbox muscle: HOW a node-local child is spawned in isolation.
# the SandboxBackend seam + its boot probe, the Firecracker microVM each run
# gets, the workspace it is handed as a block device, and the egress nft
# ruleset for its tap. carved out of capability-host, which remains the only
# in-tree caller of the run path.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# "net" pulls tokio::net::UnixStream — the guest's vsock lands on one, and so
# does each tunnel; "process" spawns the VMM; "io-util" frames the guest stream.
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tracing = { workspace = true }
# opening /dev/kvm for the boot probe: group membership on paper lies until the
# operator has re-logged in, so the probe opens the device rather than asking.
libc = "0.2"

[dev-dependencies]
# the service-root singleton test claims a real directory twice.
tempfile = "3"

[features]
# the test-harness `SandboxBackend::Bare` spawn. a `cfg(test)` gate cannot cross
# a crate boundary, so the variant capability-host's unit tests construct hangs
# off this feature instead — off in every shipped build, so a released binary
# still cannot express a bare spawn.
testkit = []
