[package]
name = "provider-host"
edition.workspace = true
version.workspace = true

# host-side capability providers: spawn the operator's locally installed
# executor CLIs (BYO — the node never holds or manages credentials; auth is
# the CLI's own problem). the consensus-side twin is crates/modules/system/capability,
# which replicates WHO provides what; this crate is the machine-local half
# that actually provides it.
[dependencies]
async-trait = { workspace = true }
axum = "0.8"
# StreamExt for the Anthropic broker's SSE passthrough (reqwest bytes_stream →
# axum Body::from_stream, never buffered) — see src/broker.rs.
futures = { workspace = true }
# the shared capability-tag shape rule: a tag that validates at spec-parse
# time can never bounce off the consensus registry's Announce validation.
capability = { workspace = true }
# the sandbox muscle: SandboxBackend + its boot probe, the Tart guest plan, and
# the node-private rootless podman (libpod socket) + egress firewall. carved out
# of this crate; re-exported from src/lib.rs so callers see no move.
sandbox-host = { workspace = true }
# the run-scoped credential broker (crates/services/broker): the loopback
# endpoint a provider child dials, and the airlock client layer behind it. the
# run loop here starts one per run and re-exports its credential vocabulary.
broker-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
# session-store file names: sha256(thread_key) makes any thread key
# filesystem-safe (see src/session.rs).
sha2 = { workspace = true }
# the capability spec format: executors are described by TOML files (embedded
# defaults + operator dir), not Rust — see src/spec.rs and docs/records/specs/capability-spec.md.
toml = "0.8"
# "net" pulls in tokio::io::unix::AsyncFd — the async wrapper around the
# interactive session's pty master (see src/interactive.rs).
tokio-stream = "0.1"
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# the bare test-harness spawn (`SandboxBackend::Bare`) and the run-loop arms
# that construct it. `cfg(test)` cannot reach across a crate boundary, so the
# variant now hangs off sandbox-host's feature of the same name and this one
# forwards to it — the two must be on or off TOGETHER, or the run loop's match
# on the backend goes non-exhaustive. the self dev-dependency below is what
# keeps them in lockstep. no shipped build enables either.
testkit = ["sandbox-host/testkit"]

[dev-dependencies]
# depending on ourselves with `testkit` on is how a test-only feature is turned
# on for our OWN unit tests (cargo allows dev-dependency cycles). it also means
# `sandbox-host/testkit` can only ever be on in a graph where our `testkit` is
# on too — the lockstep the feature comment above requires.
provider-host = { path = ".", features = ["testkit"] }
# `testkit` exposes RunBroker::start_for_test — the idle-control test drives a
# real run against a broker whose upstream is a dead port.
broker-host = { workspace = true, features = ["testkit"] }
