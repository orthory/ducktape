[package]
name = "broker-host"
edition.workspace = true
version.workspace = true

# run-scoped credential brokers: the loopback endpoint a provider child dials
# with an opaque per-run bearer, so the operator's real API/OAuth credential
# never leaves this host process. Two wire shapes ship — OpenAI Responses
# (codex) and Anthropic Messages (claude) — plus the airlock client layer that
# swaps a host-held credential for a verified TEE gateway session.
[dependencies]
# the airlock client hands back `anyhow::Error`, and a failed session handshake
# is CLASSIFIED off its cause chain (see `SessionRefusal`) rather than its text.
anyhow = "1"
axum = "0.8"
# StreamExt for the Anthropic broker's SSE passthrough (reqwest bytes_stream →
# axum Body::from_stream, never buffered).
futures = { workspace = true }
# airlock: use a verified TEE gateway as the run's Anthropic credential SOURCE
# instead of a host-held credential — handshake for a scoped session token,
# forward the run's traffic to it (the gateway swaps the token for the real
# credential in-enclave). `client` = the async Gateway. Real quote
# verification (`verify` below) is a separate opt-in: the self-hosted lender
# path (`AirlockTrust::PinnedSealPk`) never calls it.
airlock = { path = "../../airlock", features = ["client"] }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-stream = "0.1"
tracing = { workspace = true }

[features]
# Expose `RunBroker::start_for_test` (a broker aimed at a dead upstream) to
# consumer crates' tests. Off by default — the helper is not in a normal build.
testkit = []
# Real TEE quote verification (dcap-qvl/sev/a second reqwest-0.13 stack):
# the `AirlockTrust::Attested` arm (env-triggered by DUCKTAPE_AIRLOCK_ATTEST)
# and `verify_gateway`. Off by default — the everyday self-hosted lender path
# (`AirlockTrust::PinnedSealPk`) never attests; an off build refuses an
# Attested trust by name (see `open_airlock_session`) instead of silently
# falling back to a host credential.
verify = ["airlock/verify"]

[dev-dependencies]
# the in-process airlock custody test boots the gateway HTTP service itself
# (server feature) to drive sandbox → broker → gateway → upstream end to end.
airlock = { path = "../../airlock", features = ["client", "server", "verify", "testkit"] }
# the per-request log line is a CONTRACT (it is the only way to see what a
# wedged provider child asked for), so a test reads it back off a real
# subscriber rather than trusting the macro is still there.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
