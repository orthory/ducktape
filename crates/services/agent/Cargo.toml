[package]
name = "agent-service"
edition.workspace = true
version.workspace = true

# the interactive-terminal execution plane: the half of a pty session that owns
# a process. It resolves a provider, spawns the sandboxed TUI, pumps its output
# and tears it down — and it knows NOTHING about rings, ws topics, mesh peers or
# consensus. Those stay on the node, which drives this over `wire`.
[dependencies]
# the only real dependency: `spawn_interactive` and everything it needs
# (`InteractiveSession`, `RunContext`, the sandbox backend, the airlock config).
provider-host = { workspace = true }
# pty bytes cross the node boundary base64-encoded, exactly as they already do
# on the ws `term:<id>` topic and the mesh chunk event.
base64 = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# the stub Provider the session-lifetime tests drive, so a pty session's
# workdir lifetime is exercisable without podman.
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "time", "test-util"] }
