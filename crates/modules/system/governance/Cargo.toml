[package]
name = "governance"
edition.workspace = true
version.workspace = true

# member-gated governance over the validator set: proposals, ballots, and
# deterministic tally at a consensus-time deadline. depends only on `sdk` plus
# types-only interface crates (its own, valset's — membership checks go through
# host-routed queries, execution through emitted follow-up msgs), per the
# module-isolation rule. state is pure logic over a host-injected qmdb
# MerkleStore (StagedStore records); the module root IS the store's merkle
# root.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
serde = { workspace = true }
valset = { workspace = true }
# types-only: a passing ScheduleUpgrade/CancelUpgrade emits the upgrade op, and a
# passing UpdateModule/CancelModuleUpdate emits the code-swap op, both as
# follow-ups into the one lifecycle module; governance never registers it.
lifecycle = { workspace = true }
identity = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
# the invite capability (token + join-proof verification) is governance's own
# admission surface: minted by a member, redeemed in-consensus by `Redeem`.
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }

[dev-dependencies]
host = { workspace = true }
futures = { workspace = true }
sdk-testkit = { workspace = true }
# the sync round-trip proof drives a real qmdb source/joiner pair.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
