[package]
name = "saga"
edition.workspace = true
version.workspace = true

# the consensus state machine, wire types, and sdk::Module impl always compile
# (they are the surface the `saga` guest ports to wasm32). only the
# node-local usage-ledger mapper rides the `native` feature: `indexer` drags
# fluent31's unix-only IO, which cannot cross into a wasm guest — and the
# ledger is a serving-binary materialized view, never consensus state.
# `default-features = false` is therefore FULL consensus behavior, minus the
# index module.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]
default = ["native"]
native = ["dep:indexer"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
valset = { workspace = true }
capability = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# the usage-ledger mapper (src/index.rs): node-local derived tier, no consensus.
indexer = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }
host = { workspace = true }
sdk-testkit = { workspace = true }
tempfile = "3"
