# airlock — the barrier between execution and auth. The pure attestation +
# sealing + session-key handshake core, plus the async client (behind the
# `client` feature). An off-consensus feature crate; like `reachability` it uses
# vetted RustCrypto primitives (x25519/chacha/sha2) directly rather than the
# consensus identity stack, since none of this touches consensus signing.
[package]
name = "airlock"
edition.workspace = true
version.workspace = true
publish = false

[lib]
name = "airlock"
path = "src/lib.rs"

[features]
# The async HTTP client side of the handshake (Gateway + fetch_quote +
# open_session + credential upload), shared by airlock-broker and airlock-cli.
client = ["dep:reqwest"]
# The gateway HTTP service (airlock::server), used by airlock-gateway and the
# in-process e2e test. Off by default so the pure core stays IO/async-free.
server = ["dep:reqwest", "dep:axum", "dep:tokio"]
# Real quote verification: TDX via dcap-qvl (Intel root pinned in-crate), SNP
# via the AMD VCEK chain (sev crate, crypto_nossl). reqwest for PCS/KDS fetch.
verify = ["dep:dcap-qvl", "dep:sev", "dep:reqwest"]
# Test-only fake silicon: mints an SNP-format quote signed by a test chain that
# verifies ONLY under its own minted roots — never under AMD's.
testkit = ["verify", "dep:p384", "dep:rsa", "dep:x509-cert", "dep:rand"]

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = "0.12"
sha2 = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "sync", "macros"] }
dcap-qvl = { version = "0.5", optional = true }
sev = { version = "8", default-features = false, features = ["snp", "crypto_nossl"], optional = true }
p384 = { version = "0.13", optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
x509-cert = { version = "0.2", features = ["builder"], optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
# The fixture test names dcap-qvl types (QuoteCollateralV3, Quote) directly.
dcap-qvl = { version = "0.5" }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
