[package]
name = "dispatch"
edition.workspace = true
version.workspace = true

# the task plane: recipe manifests (what-to-run), capability-routed dispatch
# over saga, deterministic output-contract validation, and next-block result
# delivery. 100% self-contained — no app-module imports, ever.
[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
# default-features = false: dispatch consumes only saga's consensus surface
# (SagaOrigin/SagaView, the codecs, the shared byte caps, the trigger msgs),
# and the `runs-wasm` guest builds this crate for wasm32 — saga's native-only
# usage-ledger mapper (indexer -> unix-only IO) must not ride along. a direct
# path dep because workspace inheritance cannot switch default features off;
# feature unification keeps native binaries (which enable saga's default
# `native`) whole.
saga = { path = "../saga", default-features = false }
# the shared capability-tag shape rule for Recipe.capability validation.
capability = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
