[package]
name = "gateway"
edition.workspace = true
version.workspace = true

# Identity-authorized, consensus-replicated `.duck` routes to DuckFS or one
# node-local loopback HTTP upstream. This crate owns no sockets, ports,
# browser, proxy process, or filesystem I/O.
[dependencies]
sdk = { workspace = true }
identity = { workspace = true }
valset = { workspace = true }
# the `.duck` human-name → AccountId handle plane, absorbed as gateway's
# internal facet: gateway owns the whole name → AccountId → route pipeline as
# ONE consensus module. `duckdns` is now a LIBRARY gateway wraps — its
# `Registry`, shared value types, and handle-admission grammar — not a
# consensus module of its own.
duckdns = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
commonware-cryptography = { workspace = true }
futures = "0.3"
