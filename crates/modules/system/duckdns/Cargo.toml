[package]
name = "duckdns"
edition.workspace = true
version.workspace = true

# `.duck` account naming library: wire types, hostname grammar, replicated
# registry, and canonical state codec. Consumed by the `gateway` module, which
# owns the authenticated AccountId derivation through Identity.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# the snapshot root is sha256 over the canonical bytes; the legacy-handle
# regression test forges snapshot bytes no live `set_handle` can produce.
sha2 = { workspace = true }
