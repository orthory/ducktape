[package]
name = "vaults"
edition.workspace = true
version.workspace = true

# replicated team vaults: opaque secret ciphertext with owner/reader
# bookkeeping, write-gated by AUTHENTICATED op authorship (the ordered lane
# verifies frame signatures before the host dispatches). a canonical-bytes
# snapshot module like governance/tasks: root == sha256 of encoded committed
# state, verify-then-adopt install. depends only on `sdk` + its own types-only
# interface crate, per the module-isolation rule.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
host = { workspace = true }
futures = "0.3"
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }
