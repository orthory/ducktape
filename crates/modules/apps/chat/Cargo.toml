[package]
name = "chat"
edition.workspace = true
version.workspace = true

# the chat module: block-based channels, threads, edits, reactions, membership,
# and hook notifications on one host-injected merkle store.
#
# the consensus state machine, wire types, and sdk::Module impl always compile
# (they are the surface the wasm guest ports compile). the OFF-consensus
# media submodules ride the `native` feature: the voice/video engines (tokio,
# opus, the data plane) and the call-socket wire codec that only serving
# binaries speak. the pure index decision core (src/index.rs) compiles
# EVERYWHERE — it is what the index guest wraps. `default-features = false`
# is therefore FULL consensus behavior plus the index core, minus the media
# planes.
[features]
default = ["native"]
native = [
  "dep:data-plane",
  "dep:opus-rs",
  "dep:thiserror",
  "dep:tokio",
]
# the wasm consensus port (src/guest.rs): the store-backed dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]
# the wasm index mapper shell (src/index_guest.rs): wires the pure index core
# into the fluent31 engine. wasm-only — enabled solely by
# `guest-builder --index`.
index-guest = ["index_guest/guest"]

[dependencies]
sdk = { workspace = true }
# wasm-only, behind `guest`: the port harness (WitStore / WitCtx / host
# imports / the dispatch-shell macros). a standalone-workspace path crate,
# pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
# the index CONTRACT (op-row envelope + the pure StateRead/Writes kit) — not
# the engine: the default surface is pure types, wasm32-clean, and is all the
# native build sees. the engine shell rides the `index-guest` feature.
index_guest = { workspace = true }
# types-only: the tag-report edge (chat translates its shapes, the plane routes).
tagging = { workspace = true }
async-trait = { workspace = true }
# NFC label normalization for the derived tag index (src/index/tags.rs) —
# unconditional like the index core it serves (pure, wasm32-clean).
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# the logical-key -> store-key hash (sha256); the store itself is injected.
sha2 = { workspace = true }
# voice submodule (crates/modules/apps/chat/src/voice): real-time media over the data
# plane's datagram class. Off-consensus — no qmdb, no root-hash.
data-plane = { workspace = true, optional = true }
opus-rs = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"], optional = true }

[dev-dependencies]
host = { workspace = true }
sdk-testkit = { workspace = true }
# the tests drive the module the way a host does: construct the concrete
# QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }
# the voice e2e proofs drive the data plane's deterministic sim transport.
data-plane = { workspace = true, features = ["sim"] }
