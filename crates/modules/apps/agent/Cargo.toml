[package]
name = "agent"
edition.workspace = true
version.workspace = true

# the agent registry: a self-contained record book (owner, capability tag,
# curated skills, granted actions, status). saga supplies the canonical
# origin mirror; capability the shared capability-tag shape rule (wire types
# only).
# everything that ACTS on agents lives in the runs module.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
# default-features = false: only the wire types (SagaOrigin) cross this edge,
# and the `agent` guest builds this crate for wasm32 — saga's native-only
# index module (indexer -> unix-only IO) must not ride along. a direct path
# dep because workspace inheritance cannot switch default features off; the
# workspace's own dep is the same path, and feature unification keeps native
# binaries (which enable saga's default `native`) whole.
saga = { path = "../../system/saga", default-features = false }
capability = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = "0.3"
sdk-testkit = { workspace = true }
# the sync round-trip drives the module the way a host does: construct the
# concrete QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
# TEST-ONLY (no layering edge at build time): the agent id rule is a copy of
# duckdns's `.duck` label rule — because the id IS the local part of
# `<agent_id>@agents.duck`. `agent_id_shape_matches_the_duckdns_label_rule`
# pins the copies together so neither can drift alone.
duckdns = { workspace = true }
