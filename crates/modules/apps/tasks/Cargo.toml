[package]
name = "tasks"
edition.workspace = true
version.workspace = true

# the consensus state machine, wire types, and sdk::Module impl always compile
# (they are the surface the wasm guest port compiles). only the
# node-local derived index rides the `native` feature: `indexer` drags
# fluent31's unix-only IO, which cannot cross into a wasm guest — and the
# index is a serving-binary materialized view, never consensus state.
# `default-features = false` is therefore FULL consensus behavior, minus the
# index module.
[features]
default = ["native"]
native = ["dep:indexer"]
# the wasm-guest port (src/guest.rs): the whole-state dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexer = { workspace = true, optional = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# wasm-only, behind `guest`: the port harness (WitCtx / host imports / the
# dispatch-shell macros). a standalone-workspace path crate, pulled only when
# the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }

[dev-dependencies]
futures = "0.3"
host = { workspace = true }
sdk-testkit = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
