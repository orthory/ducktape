[package]
name = "tasks"
edition.workspace = true
version.workspace = true

# the consensus state machine, wire types, and sdk::Module impl always compile
# (they are the surface the `tasks-wasm` guest ports to wasm32). only the
# node-local derived index rides the `native` feature: `indexer` drags
# fluent31's unix-only IO, which cannot cross into a wasm guest — and the
# index is a serving-binary materialized view, never consensus state.
# `default-features = false` is therefore FULL consensus behavior, minus the
# index module.
[features]
default = ["native"]
native = ["dep:indexer"]

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexer = { workspace = true, optional = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = "0.3"
host = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
