[package]
name = "automations"
edition.workspace = true
version.workspace = true

# user-defined rules over the chat hook seam: match posts, emit chat/tasks
# follow-ups. composes chat/tasks/inbox through their crate-root wire
# types only — never their module internals.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# default-features = false on chat/tasks: only their consensus wire types
# cross this edge, and the `automations` guest builds this crate for
# wasm32 — the native-only submodules (chat's indexer/voice/tokio, tasks'
# indexer) must not ride along. direct path deps because workspace
# inheritance cannot switch default features off; the workspace's own deps
# are the same paths, and feature unification keeps native binaries (which
# enable the default `native` features) whole.
chat = { path = "../chat", default-features = false }
tasks = { path = "../tasks", default-features = false }
inbox = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# the host-side qmdb store handle the chat test fixtures inject.
statesync = { workspace = true }
# the shared programmable `TestCtx` (dev-only) — serves the live chat probe.
sdk-testkit = { workspace = true }
futures = "0.3"
host = { workspace = true }
commonware-runtime = { workspace = true }
