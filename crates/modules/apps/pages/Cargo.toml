[package]
name = "pages"
edition.workspace = true
version.workspace = true

# the consensus state machine, wire types, and sdk::Module impl always compile
# (they are the surface the `pages` guest ports to wasm32). only the
# node-local derived index rides the `native` feature: `indexer` drags
# fluent31's unix-only IO, which cannot cross into a wasm guest — and the
# index is a serving-binary materialized view, never consensus state.
# `default-features = false` is therefore FULL consensus behavior, minus the
# index module.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]
default = ["native"]
native = ["dep:indexer"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
tagging = { workspace = true }
serde = { workspace = true }
indexer = { workspace = true, optional = true }
async-trait = "0.1"
serde_json = "1"
# the logical-key -> store-key hash (sha256); the store itself is injected.
sha2 = { workspace = true }

[dev-dependencies]
host = { workspace = true }
sdk-testkit = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
# the tests drive the module the way a host does: construct the concrete
# QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
