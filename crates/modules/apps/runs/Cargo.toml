[package]
name = "runs"
edition.workspace = true
version.workspace = true

# the collaboration loop's actor: channel watches (via the tagging plane),
# run orchestration over the dispatch plane, context pinning, in-consensus
# payload composition, and deterministic model-output validation. the agents
# it runs live in the agent registry, read by query — never held here.
[features]
# the wasm-guest port (src/guest.rs): the dispatch shell over
# guest-adapter. non-default and wasm-only — enabled solely by the
# guest-builder's synthesized cdylib workspace, never by the native gate.
guest = ["dep:guest-adapter"]

[dependencies]
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
guest-adapter = { path = "../../../guests/guest-adapter", optional = true }
sdk = { workspace = true }
agent = { workspace = true }
# default-features = false on chat/tasks/pages/saga: only their consensus wire
# types cross this edge, and the `runs` guest builds this crate for
# wasm32 — the native-only submodules (chat's indexer/voice/tokio, tasks' and
# pages' indexer, saga's usage-ledger mapper) must not ride along. direct path
# deps because workspace inheritance cannot switch default features off; the
# workspace's own deps are the same paths, and feature unification keeps
# native binaries (which enable the default `native` features) whole.
chat = { path = "../chat", default-features = false }
saga = { path = "../../system/saga", default-features = false }
tagging = { workspace = true }
dispatch = { workspace = true }
tasks = { path = "../tasks", default-features = false }
# the duckfs wire types (FilesQuery::Refs / FilesReply::Refs / RefsInfo) the v3
# composer queries for the committed head it pins as source_snapshot (W2), plus
# `paths::canonical`. linked through the `files` MODULE's crate root (which
# re-exports duckfs-core) rather than duckfs-core directly, per the module rule:
# a module links other modules' wire surface, not their pure-core internals.
# default-features = false drops files' native `Files`/duckfs-disk (std::fs) so
# the `runs` guest graph stays pure, same as chat/tasks/pages above.
files = { path = "../files", default-features = false }
base64 = { workspace = true }
# the pages wire types (PageQuery::GetPage / PageReply / Block) the injector
# queries for `[[page:<id>]]` refs (M2). a normal prod-safe dep — pages pulls
# only commonware-storage (no libgit2), which chat/tasks already pull.
# default-features = false for the wasm32 graph, same as chat/tasks above.
pages = { path = "../pages", default-features = false }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# the host-side qmdb store handle the chat test fixtures inject.
statesync = { workspace = true }
# the shared programmable `TestCtx` (dev-only) — serves the dispatch sibling read.
sdk-testkit = { workspace = true }
futures = "0.3"
host = { workspace = true }
commonware-runtime = { workspace = true }
# forge is a DEV dependency ONLY — the sink emits a local Serialize mirror of
# ForgeMsg::OpenPr (production), and a conformance test pins that mirror against
# forge::decode_msg. keeping forge dev-only keeps vendored libgit2/git2 out of
# runs' production build + clippy graph.
forge = { workspace = true }
