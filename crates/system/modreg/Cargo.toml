# modreg — the module code registry. Holds each hot-swappable module's active
# code HASH plus one pending, height-gated code swap, all folded into the
# app-hash. The bytes themselves live out-of-band (content-addressed by hash);
# modreg is the consensus commitment to WHICH code is active at each height.
# Mirrors `upgrade` (schedule/cancel/advance), minus the readiness gate.
[package]
name = "modreg"
version.workspace = true
edition.workspace = true

[dependencies]
sdk = { workspace = true }
valset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = "0.3"
