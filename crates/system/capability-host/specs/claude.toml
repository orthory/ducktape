# Capability spec: Claude Code CLI.
#
# Embedded built-in default — see codex.toml for the annotated reference and
# docs/records/specs/capability-spec.md for the full format. The BASE tag ("claude") passes
# no --model flag: which model runs is the operator's CLI configuration (host
# policy). The [[variants]] below are the curated model/effort matrix — each
# expands at load time into a finer tag `claude_<model>_<effort>` carrying
# its own fully literal argv (base args + --model/--effort), overridable
# per tag like any other spec.
#
# Agentic posture: no --max-turns cap and `--permission-mode acceptEdits`
# (verified present in claude 2.1.202), so the CLI may run tool-use loops and
# edit files — confined to its cwd, which [workspace] pins to the agent's
# persistent dir under the host's agent-workspaces root. [session] adds
# thread continuity: the session id rides the --output-format json result
# object (`session_id`), and later runs of the same thread append
# `--resume <id>` to the SAME argv — the append style keeps each variant's
# --model/--effort pins on the resume path for free. The `{session_id}` slot
# is the one host-side substitution in the format, filled with an id the CLI
# itself minted — host-local plumbing, NOT the removed consensus model
# routing. Sessions are assignee-local: another node picking up the thread
# just starts cold.

spec = 1

[capability]
tag = "claude"
description = "Claude Code CLI, non-interactive print mode (BYO auth: the CLI manages its own login)"

[detect]
bin = "claude"
env = "DUCKTAPE_CLAUDE_BIN"

[invoke]
# Print mode with a single JSON result object; edits auto-accepted inside the
# workspace cwd. Prompt arrives on stdin.
args = [
    "-p",
    "--output-format",
    "json",
    "--permission-mode",
    "acceptEdits",
]
prompt = "stdin"
# The IDLE budget (output refreshes it; hard-capped at 36x). NOTE: -p with
# --output-format json prints ONE result object at the end, so this CLI is
# silent for the whole run — 600s is its longest allowed thinking/tool
# stretch, not a total-run cap. Operators override per tag by shadowing the
# spec, or globally via DUCKTAPE_PROVIDER_TIMEOUT_SECS.
timeout_secs = 600

[output]
# The single `{"type":"result",...}` object from --output-format json.
format = "json-result"

[workspace]
# Persistent per-agent cwd (<data>/agent-workspaces/<agent_id>); omit this
# section for the empty-scratch-dir fence.
mode = "persistent"

[session]
# The result object carries the session id; resuming is a flag, so the
# resume argv is the spec's own args plus --resume <id> — inherited by every
# variant with its model/effort pins intact.
capture = "json-result-field:session_id"
resume_args_append = ["--resume", "{session_id}"]

[tools]
# Wires the Ducktape MCP server into every argv this file produces — the base
# tag and every [[variants]] tag — spliced in at load time IMMEDIATELY AFTER
# args[0] (the `-p` print-mode selector). The resume path inherits it for
# free: resume_args_append glues --resume onto these same (already injected)
# args.
#
# --allowedTools is NOT optional here: in -p print mode an unapproved MCP tool
# call is a DENIAL (there is no human to approve it), so a server that is
# merely configured would be dead weight — the `mcp__ducktape` prefix
# pre-allows exactly this server's tools and nothing else.
#
# `ducktape-mcp` is resolved from the RUN's PATH — the provisioner puts its
# directory there — so this spec names no absolute path and stays portable
# across hosts. The config value is literal JSON; argv goes straight to exec,
# no shell ever sees it.
args = [
    "--mcp-config",
    '{"mcpServers":{"ducktape":{"command":"ducktape-mcp"}}}',
    "--allowedTools",
    "mcp__ducktape",
]

# ---- curated model/effort matrix -------------------------------------------
# Base args plus an explicit --model and --effort per variant. The inherited
# [session] append style adds --resume <id> after each variant's own args on
# the resume path.

[[variants]]
suffix = "fable_low"
args = ["-p", "--output-format", "json", "--permission-mode", "acceptEdits", "--model", "fable", "--effort", "low"]

[[variants]]
suffix = "fable_medium"
args = ["-p", "--output-format", "json", "--permission-mode", "acceptEdits", "--model", "fable", "--effort", "medium"]

[[variants]]
suffix = "fable_high"
args = ["-p", "--output-format", "json", "--permission-mode", "acceptEdits", "--model", "fable", "--effort", "high"]

[[variants]]
suffix = "fable_max"
args = ["-p", "--output-format", "json", "--permission-mode", "acceptEdits", "--model", "fable", "--effort", "max"]

[[variants]]
suffix = "opus_low"
args = ["-p", "--output-format", "json", "--permission-mode", "acceptEdits", "--model", "opus", "--effort", "low"]

[[variants]]
