args = ["exec", "--json", "--sandbox", "workspace-write", "--skip-git-repo-check", "-m", "gpt-5.6-sol", "-c", 'model_reasoning_effort="medium"', "-"]
resume_args = ["exec", "resume", "{session_id}", "--json", "--skip-git-repo-check", "-c", 'sandbox_mode="workspace-write"', "-m", "gpt-5.6-sol", "-c", 'model_reasoning_effort="medium"', "-"]

