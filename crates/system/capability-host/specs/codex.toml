# Capability spec: OpenAI Codex CLI.
#
# This file is EMBEDDED in the capability-host crate as a built-in default and
# parsed by the exact same code path as operator-provided specs — it is the
# reference example of the format. An operator spec with `tag = "codex"` in
# $DUCKTAPE_CAPABILITY_DIR overrides this file entirely (no field merging);
# each [[variants]] tag below is its own tag and is overridden the same way.
#
# Which MODEL codex runs is host policy, not consensus data. The BASE tag
# ("codex") passes no --model flag, so the CLI uses whatever the operator
# configured in codex itself. The [[variants]] below are the curated
# model/effort matrix: each one is load-time expansion into a finer tag
# `codex_<model>_<effort>` with its own fully literal argv (no placeholders,
# no dispatch-time routing) — exactly as if each were its own spec file.
#
# Agentic posture: `--sandbox workspace-write` lets the CLI edit files in its
# working directory — which [workspace] pins to the agent's own persistent
# dir under the host's agent-workspaces root, so edits accumulate per agent
# and never touch the node's data dir. [session] adds thread continuity: the
# session id is captured from the JSONL stream (`thread.started`.`thread_id`)
# and later runs of the same thread resume it. The `{session_id}` slot in
# resume argv is the ONE host-side substitution in the format, filled with an
# id the CLI itself minted — host-local plumbing, NOT the removed consensus
# model routing. Sessions are assignee-local: another node picking up the
# thread just starts cold.
#
# Resume flag surface (verified against codex-cli 0.144.1): `codex exec
# resume` takes --json / --skip-git-repo-check / -m / -c, but NOT --sandbox —
# the sandbox rides the config override `-c sandbox_mode="workspace-write"`
# instead, so nothing is dropped on the resume path.
#
# Format reference: docs/records/specs/capability-spec.md

spec = 1

[capability]
tag = "codex"
description = "OpenAI Codex CLI, non-interactive one-shot exec mode (BYO auth: the CLI manages its own login)"

[detect]
# Probed on PATH; DUCKTAPE_CODEX_BIN points at an explicit binary instead
# (an explicit override that does not exist is a loud warning + absent
# capability, never a silent fallback to PATH).
bin = "codex"
env = "DUCKTAPE_CODEX_BIN"

[invoke]
# One-shot exec, workspace-write sandbox (edits confined to the cwd = the
# agent's workspace), machine-readable event stream. The trailing "-" tells
# codex to read the prompt from stdin (fed concurrently, then EOF). Args are
# fully literal — no placeholders.
args = [
    "exec",
    "--json",
    "--sandbox",
    "workspace-write",
    "--skip-git-repo-check",
    "-",
]
prompt = "stdin"
# The IDLE budget (output refreshes it; hard-capped at 36x). `exec --json`
# streams an event per action, so a long agentic run refreshes continuously
# and only a genuinely STALLED run dies at this window. Operators override
# per tag by shadowing the spec, or globally via
# DUCKTAPE_PROVIDER_TIMEOUT_SECS.
timeout_secs = 600

[output]
# The `codex exec --json` JSONL event stream: the LAST agent_message wins.
format = "jsonl-events"

[workspace]
# Persistent per-agent cwd (<data>/agent-workspaces/<agent_id>); omit this
# section for the empty-scratch-dir fence.
mode = "persistent"

[session]
# `codex exec --json` announces the session as
# {"type":"thread.started","thread_id":"<uuid>"}; resuming is a SUBCOMMAND,
# so the resume argv is a full replacement (variants pin their -m/-c flags in
# their own resume_args below — an inherited argv could not carry a
# per-variant flag).
capture = "jsonl-events"
resume_args = [
    "exec",
    "resume",
    "{session_id}",
    "--json",
    "--skip-git-repo-check",
    "-c",
    'sandbox_mode="workspace-write"',
    "-",
]

[isolation]
# THE STRONG AUTH PATH: the operator's credential never enters the codex
# process. The HOST reads it (OPENAI_API_KEY, else ~/.codex/auth.json) and holds
# it in the node; a per-run loopback Responses broker serves the model API, and
# codex gets only an opaque random bearer plus a 127.0.0.1 base URL, both of
# which die with the run. Neither can recover the credential.
#
# config_home_env is what MAKES that true. Pointed at a fresh, EMPTY CODEX_HOME
# under the run's workdir, codex cannot read the operator's ~/.codex/auth.json
# and must use the broker the argv names. Without it the broker would be
# decorative — codex would just log in from the dotfile as before.
#
# Note there is deliberately NO [sandbox] rw_dirs here (it is a hard load error
# to have both): mounting ~/.codex would put the credential back in the child
# and quietly undo all of the above. Applies under the Direct AND Podman
# backends; Tart is rejected loudly (a VM guest cannot reach host loopback).
# Inherited by every [[variants]] tag below.
config_home_env = "CODEX_HOME"
broker = "codex-responses"

[context]
# WHERE THE AGENT'S SOUL LANDS. The host assembles the agent's curated skills
# into one markdown document per run; this names the file THIS CLI already
# auto-loads it from, so no Rust ever branches on an executor name. codex reads
# $CODEX_HOME/AGENTS.md as its global instructions (verified live), and
# [isolation] above already gives every run a fresh, empty CODEX_HOME — so the
# doc lands in a directory only this run can see.
#
# That directory sits under the workdir's reserved .ducktape-run/ dir, which the
# provisioner deletes before duckfs/forge scan the tree: the soul can never
# become an agent artifact, and it never collides with a repository's OWN
# AGENTS.md (which stays inside the checkout and layers on top of this one).
# Under the Podman sandbox it crosses for free — the workdir is already mounted.
# Inherited by every [[variants]] tag below.
path = "config-home:AGENTS.md"

[tools]
# Wires the Ducktape MCP server into every argv this file produces — the base
# tag, every [[variants]] tag, and the resume argv — spliced in at load time
# IMMEDIATELY AFTER args[0] (the `exec` subcommand). Not appended: codex's
# trailing bare "-" (prompt from stdin) must stay LAST.
#
# `ducktape-mcp` is resolved from the RUN's PATH — the provisioner puts its
# directory there — so this spec names no absolute path and stays portable
# across hosts. The values carry embedded double quotes because codex parses
# a -c override as TOML; argv goes straight to exec, no shell ever sees it.
# env_vars is a names-only allowlist: codex reads the values from the run env,
# so the session key and other per-run values never enter argv.
#
# default_tools_approval_mode="approve" is LOAD-BEARING, and its name reads
# backwards. `codex exec` is non-interactive: there is no human to answer an
# approval prompt, so any MCP tool call that WANTS one is auto-cancelled
# ("user cancelled MCP tool call") and the agent silently loses its whole tool
# plane. Of the four modes (auto / prompt / writes / approve) only `approve`
# means "these tools are already approved — do not ask"; the other three ask,
# and asking is a denial here. Verified against codex-cli 0.144.1 by running
# the real argv: with `approve` the call completes and returns the server's
# payload, and the run's `--sandbox workspace-write` is STILL enforced (a
# direct `curl` to the node from the agent's shell fails with exit 7 in the
# same run). That is the whole reason the tool plane is an MCP server the
# RUNNER spawns rather than a CLI on the agent's PATH: the sandbox has no
# network, and this is the only door through it.
args = [
    "-c",
    'mcp_servers.ducktape.command="ducktape-mcp"',
    "-c",
    'mcp_servers.ducktape.env_vars=["DUCKTAPE_NODE","DUCKTAPE_RUN_AGENT","DUCKTAPE_RUN_WORKSPACE","DUCKTAPE_RUN_SKILLS","DUCKTAPE_RUN_SESSION_KEY","DUCKTAPE_RUN_ID","DUCKTAPE_PROVIDER_CONTROL_URL","DUCKTAPE_PROVIDER_CONTROL_TOKEN"]',
    "-c",
    'mcp_servers.ducktape.default_tools_approval_mode="approve"',
]

# ---- curated model/effort matrix -------------------------------------------
# The models the codex CLI itself lists (0.144.1): the gpt-5.6 family plus
# gpt-5.5. Each model carries only the efforts that model actually supports —
# 5.6 goes up to `max`, 5.5 stops at `xhigh` — so no tag promises a run the
# CLI would reject. (`ultra` is deliberately absent: it delegates subtasks,
# which does not belong in a one-shot non-interactive exec.) Retiring a model
# here retires its tags; an operator keeping an older one shadows it with
# their own spec file.
#
# Each variant pins the model with -m and the reasoning effort with -c. The
# -c value deliberately carries embedded double quotes ('...="low"'): codex
# parses the value as TOML, and argv goes straight to exec — no shell ever
# sees it. The trailing "-" (prompt from stdin) stays LAST. Each variant's
# resume_args repeats its pins so a resumed thread keeps the exact model and
# effort the tag promises.

[[variants]]
suffix = "gpt-5.6-sol_low"
args = ["exec", "--json", "--sandbox", "workspace-write", "--skip-git-repo-check", "-m", "gpt-5.6-sol", "-c", 'model_reasoning_effort="low"', "-"]
resume_args = ["exec", "resume", "{session_id}", "--json", "--skip-git-repo-check", "-c", 'sandbox_mode="workspace-write"', "-m", "gpt-5.6-sol", "-c", 'model_reasoning_effort="low"', "-"]

[[variants]]
