[package]
name = "duckdns"
edition.workspace = true
version.workspace = true

# `.duck` account naming: wire types, hostname grammar, replicated registry,
# canonical state codec, and the Ducktape module adapter that derives the
# authenticated AccountId through Identity.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sdk = { workspace = true }
identity = { workspace = true }
valset = { workspace = true }
