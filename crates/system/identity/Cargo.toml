[package]
name = "identity"
edition.workspace = true
version.workspace = true

# the account registry as replicated state: an ACCOUNT (an umbrella keyed by
# its founding key) collects many MEMBER KEYS of different schemes and owns
# many NODES (each a mesh/valset identity). depends on sdk + valset wire types
# (to member-gate binds) + commonware-cryptography (to verify ed25519/p256
# member certificates deterministically) + p256/base64 (for the bespoke
# WebAuthn passkey envelope, which commonware's namespaced signer can't cover).
[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
valset = { workspace = true }
commonware-cryptography = { workspace = true }
# union_unique: the exact namespaced signing preimage commonware's native
# verify hashes -- exposed so the enrollment side hands a phone the precise
# bytes to ECDSA-sign for a P256 member (the page never reframes them).
commonware-utils = { workspace = true }
# required for the PublicKey/Signature-from-bytes api (DecodeExt) -- same
# reason valset depends on it.
commonware-codec = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# the WebAuthn (passkey) member-key kind verifies a raw ECDSA-P256 assertion
# envelope (authData ‖ SHA256(clientDataJSON)), NOT commonware's namespaced
# signer -- so it uses the RustCrypto p256/ecdsa primitives directly. both are
# already compiled into the tree transitively via commonware-cryptography; this
# only promotes them to direct deps. deterministic (pure-Rust verify on every
# arch), so consensus-safe.
p256 = "0.13"
# base64url-decoding the WebAuthn challenge out of clientDataJSON.
base64 = "0.22"

[dev-dependencies]
futures = "0.3"
