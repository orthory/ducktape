[package]
name = "dispatch"
edition.workspace = true
version.workspace = true

# the task plane: recipe manifests (what-to-run), capability-routed dispatch
# over saga, deterministic output-contract validation, and next-block result
# delivery. 100% self-contained — no app-module imports, ever.
[dependencies]
sdk = { workspace = true }
dispatch-interface = { workspace = true }
saga-interface = { workspace = true }
# the shared capability-tag shape rule for Recipe.capability validation.
capability-interface = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = "0.3"
