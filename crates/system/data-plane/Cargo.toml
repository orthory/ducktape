[package]
name = "data-plane"
edition.workspace = true
version.workspace = true

[features]
# Deterministic in-memory transport arm (no sockets) — the test/simulation
# counterpart to the future overlay-socket arm, mirroring nat-traversal's
# `simnat`. Enabled for this crate's own integration tests via the self
# dev-dependency below.
sim = []

[dependencies]
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "io-util"] }

[dev-dependencies]
data-plane = { workspace = true, features = ["sim"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "io-util", "test-util"] }
