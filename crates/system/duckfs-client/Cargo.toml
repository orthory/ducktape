[package]
name = "duckfs-client"
edition.workspace = true
version.workspace = true

# the OS-side checkout/commit engine for duckfs: chunk hashing, the versioned
# .duckfs index, worktree scan/status, change planning, and the synchronous
# NodeApi transport seam. consensus never sees this crate — it lives strictly on
# the client side of the wire (spec: the determinism boundary). the `files` pure
# core (default-features off) supplies the wire types, object hashing, and path
# canonicalization so a client id is byte-identical to what a validator derives.
[dependencies]
# the pure core only (no native module glue): wire types, object hashing, and
# path canonicalization. a direct path — the workspace `files` dep defaults
# features on and cargo forbids inheriting it back to false.
files = { path = "../../apps/files", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
# the mock NodeApi stands a REAL native `files::Files` on a tempdir, so the tests
# pull in the module glue (native feature) plus the block_on drivers.
files = { path = "../../apps/files" }
sdk = { workspace = true }
tempfile = { workspace = true }
futures = "0.3"
async-trait = { workspace = true }
