[package]
name = "dispatch-oracle"
edition.workspace = true
version.workspace = true

# host-side worker for dispatch WorkSpec saga effects: resolve the capability
# to a local provider, feed the payload VERBATIM, submit the raw answer. no
# prompt text, no output parsing opinions, no credential handling — contract
# enforcement is the dispatch module's consensus-side validation.
[dependencies]
async-trait = { workspace = true }
capability-host = { workspace = true }
dispatch = { workspace = true }
# the pool's spawn/deliver seams are boxed futures; the semaphore caps
# concurrent provider runs (tokio::sync is runtime-agnostic).
futures = "0.3"
reactor = { workspace = true }
saga = { workspace = true }
sdk = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
