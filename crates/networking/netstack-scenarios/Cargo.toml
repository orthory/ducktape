[package]
name = "netstack-scenarios"
edition.workspace = true
version.workspace = true

# The netstack machine's frozen lifecycle suite: a pure harness (N machines
# on a scripted network, a modeled resolver, a discrete-event clock — no
# runtime, no sockets, no sleeps) plus every lifecycle the machine must
# survive, each pinned as a golden event→effect trace under fixtures/. A
# library, so the SAME suite runs over every backend — the native machine
# in this crate's tests, the wasm guest in netstack-wasm's — and the traces
# must match byte for byte.
[dependencies]
commonware-cryptography = { workspace = true }
nat-traversal = { workspace = true }
netstack-machine = { workspace = true }
sha2 = { workspace = true }
wireguard = { workspace = true }
