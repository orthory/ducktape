[package]
name = "netstack-wasm"
edition.workspace = true
version.workspace = true

# The wasmtime embedding of the `ducktape:netstack` world: runs the netstack
# machine's component as a `NetstackMachine` the host executor drives exactly
# like the native one. Off-consensus, so the envelope is fuel per step and no
# ambient imports — the guest's obligation is a trace identical to the native
# machine's, not a root hash.
[dependencies]
netstack-machine = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wasmtime = { workspace = true }
wireguard = { workspace = true }

[dev-dependencies]
commonware-cryptography = { workspace = true }
netstack-scenarios = { workspace = true }
