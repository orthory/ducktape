[package]
name = "overlay-net"
edition.workspace = true
version.workspace = true

[dependencies]
commonware-runtime = { workspace = true }
# the wrapper context implements commonware-runtime's `Clock`, whose
# supertraits live in governor; and its rng bounds, which live in rand_core.
# both pinned to the exact versions commonware-runtime itself depends on —
# a different semver-major here would be a different trait.
governor = { workspace = true }
rand_core = { workspace = true }

# ── the userspace backend ───────────────────────────────────────
# the sans-io WireGuard core: one `noise::Tunn` per peer, no device layer.
defguard_boringtun = { workspace = true }
# the `WireGuardEffect` trait this backend implements (the orchestration
# boundary does not move).
wireguard = { workspace = true }
# the virtual host terminating TCP/UDP at the node's overlay ULA.
smoltcp = { workspace = true }
# peer-labeled session lifecycle events (`ducktape::dataplane`); boringtun's own
# contextless timer lines are pinned off in noded's log filter.
tracing = { workspace = true }
# the socket seam this backend feeds: `VirtualSocketFactory`
# implements data-plane's `SocketFactory` over the virtual stack. traits
# only — the plane itself stays instantiated in the node layer.
data-plane = { workspace = true }
# the pumps: underlay UDP, timer driver, and the async socket surface —
# tokio to match data-plane's transport arm (the factory this backend feeds).
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "io-util", "net"] }

[dev-dependencies]
# the `wg_interop` example speaks the `wg` tool's base64 key form on its CLI.
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
