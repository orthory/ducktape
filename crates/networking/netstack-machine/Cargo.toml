[package]
name = "netstack-machine"
edition.workspace = true
version.workspace = true

# The netstack's sans-I/O decision core: the reachability protocol as a pure
# event-in/effects-out state machine, plus the pure protocol modules it owns
# (epoch state, wire messages, derived bindings, the persisted-mesh codec).
# Deliberately NO tokio, NO filesystem, NO sockets, NO clock — the host side
# (the `reachability` crate's executor and resolver runtime) performs every
# effect and stamps every step. This boundary is what phases 2-4 of the
# netstack arc freeze, trace, and compile to wasm.
[dependencies]
borsh = { workspace = true, features = ["unstable__schema"] }
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true }
# NodeKey only — the rendezvous RUNTIME stays host-side in `reachability`,
# and off the wasm32 build entirely.
nat-traversal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wireguard = { workspace = true }
wit-bindgen = { workspace = true, optional = true }

[features]
# the `ducktape:netstack` component port (src/guest.rs): the machine behind
# the wasm boundary. NEVER enabled by a host-side dependent — only
# guest-builder's synthesized wasm32 workspace turns it on.
guest = ["dep:wit-bindgen"]
