[package]
name = "nat-traversal"
edition.workspace = true
version.workspace = true

[dependencies]
arrayvec = { workspace = true }
# Already resolved in the workspace lockfile via commonware-cryptography's own
# blake3 dependency — this just wires the same crate into nat-traversal's own
# tree for the coordinator's keyed-hash cookie (BindResponse / Register).
blake3 = "1"
borsh = { workspace = true, features = ["unstable__schema"] }
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }
crossbeam-channel = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
# Already a workspace dependency (used across the tree) — only the boot-random
# cookie key needs it here, so it stays a runtime-only concern.
rand = { workspace = true, optional = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# io-util: the relay lane's TCP framing (read_exact/write_all) — a feature on
# the existing tokio dep, not a new dependency.
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
    "net",
    "rt",
    "time",
    "sync",
    "macros",
    "rt-multi-thread",
    "io-util",
] }

[features]
default = ["runtime"]
# The coordinator, client, and relay runtime: everything that owns a socket
# or a clock. Off, the crate is its pure wire + auth surface — what the
# netstack machine consumes, natively and on wasm32.
runtime = ["dep:tokio", "dep:crossbeam-channel", "dep:lru", "dep:rand"]
simnat = ["runtime"]

[[bench]]
name = "coordinator_hot_path"
harness = false
required-features = ["runtime"]

[[test]]
name = "punch_e2e"
required-features = ["runtime"]
