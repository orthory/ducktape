[package]
name = "nat-traversal"
edition.workspace = true
version.workspace = true

[dependencies]
arrayvec = { workspace = true }
borsh = { workspace = true, features = ["unstable__schema"] }
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }
crossbeam-channel = { workspace = true }
lru = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
# io-util: the relay lane's TCP framing (read_exact/write_all) — a feature on
# the existing tokio dep, not a new dependency.
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = [
    "net",
    "rt",
    "time",
    "sync",
    "macros",
    "rt-multi-thread",
    "io-util",
] }

[features]
simnat = []

[[bench]]
name = "coordinator_hot_path"
harness = false
