[package]
name = "nat-traversal"
edition.workspace = true
version.workspace = true

[dependencies]
arrayvec = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }
crossbeam-channel = { workspace = true }
lru = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
# io-util: the relay lane's TCP framing (read_exact/write_all) — a feature on
# the existing tokio dep, not a new dependency.
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }

[dev-dependencies]
# a SELF dev-dependency (the `data-plane` pattern): `tests/simnat_ci.rs` imports
# `SimNat`/`drive_simulated`, which live behind `simnat`, and carries no cfg or
# `required-features` — so `cargo test -p nat-traversal` does not merely skip it,
# it FAILS TO COMPILE the package. Turning the feature on for our own test build
# makes the focused invocation work and run the suite (6 tests) instead.
nat-traversal = { path = ".", features = ["simnat"] }
tokio = { workspace = true, features = [
    "net",
    "rt",
    "time",
    "sync",
    "macros",
    "rt-multi-thread",
    "io-util",
] }

[features]
simnat = []

[[bench]]
name = "coordinator_hot_path"
harness = false
