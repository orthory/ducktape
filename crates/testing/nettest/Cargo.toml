[package]
name = "nettest"
edition.workspace = true
version.workspace = true

# dev/test-only shared harness support: a raw-HTTP-over-TCP client, collision-
# safe port allocation, and a coarse event poll. NOT a production crate — no
# shipping crate depends on it; it exists so the node/daemon/sim integration
# suites stop each re-rolling a subtly-different (and racier) copy of the same
# three helpers. Deliberately dependency-light (std + serde_json) so pulling it
# into a test build costs nothing.

[lib]
name = "nettest"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true }
