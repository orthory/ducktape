[package]
name = "agents-view"
version = "0.1.0"
edition = "2024"
publish = false

# A dynamically loaded WASM view; component exports require unsafe export names.
[lib]
crate-type = ["cdylib", "rlib"]
# Integration tests drive the view natively through the wire.
test = false

[dependencies]
iced.workspace = true
serde.workspace = true
serde_json.workspace = true
ui-lang-guest.workspace = true
ui-lang-runtime.workspace = true
