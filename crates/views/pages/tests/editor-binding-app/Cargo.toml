[package]
name = "pages-editor-binding-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false

[dependencies]
design = { path = "../../../support/design" }
ui-lang-wire = { workspace = true }
iced = { version = "=0.14.0", default-features = false, features = ["advanced"] }
serde = { version = "1", features = ["derive"] }
ui-lang = { workspace = true }
ui-lang-guest = { workspace = true }
ui-lang-runtime = { workspace = true }

[build-dependencies]
ui-lang-build = { workspace = true }

[features]
host-verification = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "46"
optional = true
default-features = false
features = ["cranelift", "runtime", "cache", "parallel-compilation", "component-model"]

[[test]]
name = "wasm"
required-features = ["host-verification"]
