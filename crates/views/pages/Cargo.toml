[package]
name = "pages-view"
version = "0.1.0"
edition = "2024"
publish = false

# Rust-authored declarative UI, dynamically loaded as a WASM component.
[lib]
crate-type = ["cdylib", "rlib"]
# Integration tests drive the guest directly through its wire contract.
test = false

[dependencies]
pulldown-cmark = "0.12.2"
ui-lang-wire.workspace = true
# the product icon set, as bytes the wire carries
design = { path = "../support/design" }
iced.workspace = true
serde.workspace = true
serde_json.workspace = true
ui-lang-guest.workspace = true
ui-lang-runtime.workspace = true
