# The wasm port of the `governance` module: compiles the NATIVE governance
# crate to wasm32 and adapts it to the ducktape:module world through
# guest-adapter — the module's logic stays single-sourced in
# `crates/modules/system/governance`. The per-network invite binding is NOT compiled
# in: it arrives via the GENESIS-CONFIG store entry the host installs (see
# `sdk::genesis_config`). Standalone workspace: guest crates build to
# `wasm32-unknown-unknown` and are componentized by the module build target,
# never by the host workspace.
[package]
name = "governance-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
guest-adapter = { path = "../guest-adapter" }
governance = { path = "../../modules/system/governance" }
sdk = { path = "../../kernel/sdk" }

[workspace]

# governance -> commonware-cryptography enables getrandom's "js"/"wasm_js"
# backend on wasm32, which bakes unstrippable wasm-bindgen imports into the
# cdylib and breaks componentization. no consensus path ever calls getrandom
# (modules are deterministic by contract; the guest only links the pure
# verify paths), so the guest links vendored stubs whose only backend is a
# deterministic refusal — see getrandom-stub/Cargo.toml. one stub per major
# the graph pulls (0.2 / 0.3 / 0.4 — commonware 2026.7 brought in the
# latter two).
[patch.crates-io]
getrandom = { path = "getrandom-stub" }
getrandom-03 = { package = "getrandom", path = "getrandom-stub-03" }
getrandom-04 = { package = "getrandom", path = "getrandom-stub-04" }

# blst reaches every commonware-cryptography guest unconditionally, but no
# module calls bls12381 — wasm-ld dead-strips every blst symbol from the
# shipped module. Compiling its C for wasm32 would still demand a
# wasm-capable clang (apple clang has no wasm backend at all), so the guest
# links a vendored blst whose build.rs skips the C on wasm32. A guest that
# ever really calls blst fails the link loudly — see patches/blst/PATCH.md.
blst = { path = "../../../patches/blst" }
