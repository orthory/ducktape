# The governance module's VIEW: an ordinary Ice application built on
# `ui-lang-guest` to wasm32-unknown-unknown and shipped beside the module's
# component as `governance.view.wasm` (`make wasm-views`). The app loads it
# from the modules dir and runs it in a fuel and memory budget
# (`app/src/backend/wasm_view.rs`).
#
# Standalone workspace, like every guest: the crate targets wasm32 and the
# software renderer alone — the guest driver records through
# `iced_tiny_skia`'s layers, and a workspace that enables wgpu anywhere
# turns `iced::Renderer` into the fallback enum the generated view is bound
# to. `iced_tiny_skia` is ducktape-ui's vendored copy, the one that exposes
# those layers.
[package]
name = "governance-view"
version = "0.0.0"
edition = "2024"
publish = false

# `unsafe_code` is not forbidden only because the exports need
# `#[unsafe(no_mangle)]`.
[lib]
crate-type = ["cdylib", "rlib"]
# The generated `#[cfg(test)]` glue needs the runtime's test driver, which
# pulls wgpu into the graph; the tests live in `tests/` instead.
test = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tiny-skia", "fira-sans"] }
serde_json = "1"
ui-lang = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764" }
ui-lang-runtime = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764", default-features = false, features = ["full-runtime"] }
ui-lang-guest = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764" }

[build-dependencies]
ui-lang-build = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764" }

[patch.crates-io]
iced_tiny_skia = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764" }
iced_winit = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764" }

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
