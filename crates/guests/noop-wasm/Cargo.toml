# The smallest compliant wasm module: authored against the ducktape:module
# world, does nothing. Standalone workspace like every guest crate: builds to
# `wasm32-unknown-unknown` and is componentized by the module build target,
# never by the host workspace.
[package]
name = "noop-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"

[workspace]
