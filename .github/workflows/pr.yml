# The PR gate. Everything in .github/workflows/ before this was push-triggered
# and path-filtered, so a pull request against `dev` carried no checks at all
# (#1392). This workflow runs on every PR targeting `dev` and gates on the
# things the dev loop already treats as load-bearing: the committed wasm
# component bytes (`make wasm-modules-check`) and that no binary embeds any
# of them (`make wasm-embed-check`), the genesis root-hash pin
# (`host_state`), the simnode suites (`cargo test -p simnode` — the sim's own
# genesis pin in `topology_set.rs` lives here, alongside every other simnode
# scenario; #1433), and clippy across the workspace.
name: pr

on:
  pull_request:
    branches: [dev]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rustc segfaults under load with the default job count on shared runners
  # too; keep this in step with the worktree constraint documented for local
  # agent work (docs/superpowers/plans — Global Constraints).
  CARGO_BUILD_JOBS: 3

jobs:
  wasm-modules-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest ships rustup; the checkout's rust-toolchain.toml pins
      # the exact channel + targets, so this just makes rustup install it.
      - run: rustup show
      - run: cargo install wasm-tools --locked
      - run: make wasm-modules-check
      - run: make wasm-embed-check

  genesis-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --locked -p node-bin host_state

  # A separate job (not folded into genesis-pin) so it runs in parallel
  # rather than lengthening one job's critical path. `cargo test -p simnode`
  # cranelift-compiles the sim's module set per boot (25–29 min on the
  # 2-core runner, so the timeout sits well above that) with no sandbox,
  # microVM, or outbound network — every simnode test binds loopback only —
  # so the whole crate runs here, not a scoped subset. This is the job that
  # was missing (#1433): `topology_set.rs`'s `DEFAULT_GENESIS_ROOT_HASH`
  # pins the sim's own genesis composition and drifted unnoticed with no PR
  # gate exercising it.
  #
  # DUCKTAPE_WASM_CACHE_DIR turns on wasmtime's own compilation cache
  # (wasm-host's `sim_wasm_cache`) for this job ONLY: the 13 test binaries all
  # boot the SAME 15-module `topology::SIM_BASE` genesis, so after the first
  # binary compiles it, every later one loads the cranelift artifacts from
  # disk instead of recompiling them. A node never sets this env var, so
  # production boot behavior is unchanged. The dir lives under `target/` so
  # Swatinem/rust-cache's `cache-directories` persists it across runs.
  simnode-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUCKTAPE_WASM_CACHE_DIR: ${{ github.workspace }}/target/sim-wasm-cache
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sim-wasm-cache
      - run: rustup show
      - run: cargo test --locked -p simnode

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
      # the default workspace build never enables airlock's `verify` feature
      # (#1302 — dcap-qvl/sev/a second reqwest-0.13 stack are opt-in), so the
      # attested-path code (crates/services/broker/src/attested.rs,
      # bin/node/src/cred_seal.rs) needs its own compile check or it rots
      # unnoticed between the rare `--features verify` runs.
      - run: cargo clippy --locked -p node-bin -p broker-host -p provider-host --tests --no-deps --features node-bin/verify,broker-host/verify,provider-host/verify -- -D warnings
