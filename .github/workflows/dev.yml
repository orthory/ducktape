# The dev gate. The whole suite runs once per push to `dev` — every merge —
# and on demand for a branch someone wants checked before it lands
# (`gh workflow run dev.yml --ref <branch>`). Nothing runs on a pull request:
# a cold run is ~35 min wall-clock and ~2.5 h of runner time, and the GitHub
# cache is branch-scoped, so a suite that only ran on PRs never left a warm
# `target/` on `dev` for the next PR to restore — every PR compiled the
# workspace from scratch. Running here saves the cache on `dev`, where every
# later run (a dev push or a dispatched branch) restores it.
#
# What it gates: the committed wasm component bytes (`make wasm-modules-check`)
# and that no binary embeds any of them (`make wasm-embed-check`), the
# genesis root-hash pin (`host_state`), the simnode suites (`cargo test -p
# simnode` — the sim's own genesis pin in `topology_set.rs` lives here,
# alongside every other simnode scenario), and clippy across the workspace.
name: dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Runs queue per ref rather than cancel: a cancelled job saves no cache, and
# nothing waits on this lane.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # rustc segfaults under load with the default job count on shared runners
  # too; keep this in step with the worktree constraint documented for local
  # agent work (docs/superpowers/plans — Global Constraints).
  CARGO_BUILD_JOBS: 3

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/ci-scope.py --self-test
      - id: scope
        env:
          # the ref's tip before this push; a dispatch carries none
          BASE_SHA: ${{ github.event.before }}
        run: |
          # No base to diff against — a dispatch, or a branch's first push
          # (the null sha) — runs the whole suite.
          case "$BASE_SHA" in
            ''|0000000000000000000000000000000000000000)
              echo "full=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 .github/ci-scope.py "$BASE_SHA" >> "$GITHUB_OUTPUT"

  wasm-modules-check:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest ships rustup; the checkout's rust-toolchain.toml pins
      # the exact channel + targets, so this just makes rustup install it.
      - run: rustup show
      - run: make wasm-modules-check
      - run: make wasm-embed-check

  # Rebuild every component and index guest from the source at HEAD and
  # compare against the committed bytes. Comparing committed copies alone
  # cannot detect stale bytes; a mismatch here means the guest source moved
  # and its `component.wasm` was not rebuilt with it.
  wasm-rebuild-check:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --locked -p guest-builder
      - run: make wasm-rebuild-check

  genesis-pin:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: make views
      - run: make views-repro-check
      - run: cargo test --locked -p node-bin host_state

  # the wasm/native cutover-continuity proofs (crates/kernel/host/tests/wasm_*_parity.rs):
  # each op sequence must commit the identical root, replies and rejection
  # reasons on both a native module and its wasm guest, block by block. A
  # fixture written before a module's admission rule shifted fails here.
  # Measured ~1 min for `--tests` warm-cache locally, plus the ~2-3 min
  # host-crate compile; 30 min matches the other host-crate jobs.
  host-parity:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --locked -p host --tests

  # A separate job (not folded into genesis-pin) so it runs in parallel
  # rather than lengthening one job's critical path. `cargo test -p simnode`
  # cranelift-compiles the sim's module set per boot (25–29 min on the
  # 2-core runner, so the timeout sits well above that) with no sandbox,
  # microVM, or outbound network — every simnode test binds loopback only —
  # so the whole crate runs here, not a scoped subset. `topology_set.rs`'s
  # `DEFAULT_GENESIS_ROOT_HASH` pins the sim's own genesis composition, and
  # this is the only job that exercises it.
  #
  # DUCKTAPE_WASM_CACHE_DIR turns on wasmtime's own compilation cache
  # (`simnode::boot` calls `wasm_host::enable_compilation_cache`) for this job
  # ONLY: the 13 test binaries all
  # boot the SAME 15-module `topology::SIM_BASE` genesis, so after the first
  # binary compiles it, every later one loads the cranelift artifacts from
  # disk instead of recompiling them. A node never sets this env var, so
  # production boot behavior is unchanged. The dir lives under `target/` so
  # Swatinem/rust-cache's `cache-directories` persists it across runs.
  simnode-suite:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUCKTAPE_WASM_CACHE_DIR: ${{ github.workspace }}/target/sim-wasm-cache
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sim-wasm-cache
      - run: rustup show
      - run: make views
      - run: cargo test --locked -p simnode

  # The rendezvous/coordinator unit lane: `reachability::rendezvous::tests`
  # and coordinator-bin's `probe_floods_invalid_signatures_then_recovers`
  # guard the advert book's readvertise-nonce and Lookup-source-binding
  # rules. `--lib` only — `coordinator-bin`'s integration suites
  # (deploy_smoke, policy_args, smoke) bind real sockets and belong with the
  # other integration jobs above, not this fast unit lane.
  net-unit:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --locked -p reachability -p nat-traversal -p coordinator-bin --lib -j 4

  clippy:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings

  # The app's whole test lane: its source lints, its backend stubs and the
  # staged module views (`make views`) it mounts in `module_view` tests.
  view-artifact:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: apt deps (bindgen/alsa-sys need libclang + alsa headers)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: make views
      - run: cargo test --locked -p ducktape-rpc --test blob
      - run: cargo test --locked -p ducktape-app

  # The module-owned views (crates/views) are their own workspace, so the
  # workspace gates above never see them: their wire tests and lints run
  # here, natively — the wasm bundle itself is `make views`, a build step.
  module-views:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a successful scope decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL_SUITE: ${{ needs.scope.outputs.full }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$FULL_SUITE" = true || test "$FULL_SUITE" = false
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/views
      - run: rustup show
      # Format the views workspace, including its shared design source; the
      # desktop host workspace is checked independently.
      - run: rustfmt --edition 2024 --check $(git ls-files 'crates/views/*.rs')
      - run: cargo test --locked --manifest-path crates/views/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/views/Cargo.toml --tests --no-deps -- -D warnings
      # the default workspace build never enables airlock's `verify` feature
      # (#1302 — dcap-qvl/sev/a second reqwest-0.13 stack are opt-in), so the
      # attested-path code (crates/services/broker/src/attested.rs,
      # bin/node/src/cred_seal.rs) needs its own compile check or it rots
      # unnoticed between the rare `--features verify` runs.
      - if: needs.scope.outputs.full == 'true'
        run: cargo clippy --locked -p node-bin -p broker-host -p provider-host --tests --no-deps --features node-bin/verify,broker-host/verify,provider-host/verify -- -D warnings
