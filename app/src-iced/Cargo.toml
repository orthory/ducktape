[package]
name = "ducktape-iced"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["cef-browser"]
cef-browser = ["dep:cef", "dep:cef-dll-sys", "dep:x11-dl"]

[dependencies]
cef = { version = "=148.0.0", features = ["build-util", "linux-x11", "sandbox"], optional = true }
# cef's published manifest permits newer 148.x bindings, which are not wire-
# compatible with its generated 148.0.0 wrapper. Pin both halves explicitly.
cef-dll-sys = { version = "=148.0.0", optional = true }
iced = { version = "=0.14.0", features = ["tokio", "advanced-shaping", "svg", "image"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "fs", "io-util"] }
zeroize = { workspace = true }
getrandom = "0.2"
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tiny_http = "0.12"
toml = "0.8"
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
qrcode = { version = "0.14", default-features = false }
tempfile.workspace = true
unicode-normalization.workspace = true
notify-rust = "4.18"
oxideav-vp8 = { version = "=0.2.6", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
linuxvideo = "0.3.5"
x11rb = "0.13"
x11-dl = { version = "2.21", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder", "NSView"] }
block2 = "0.6"
tray-icon = "0.24"
png = "0.18"
cpal = { version = "=0.18.1", default-features = false }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-avfoundation"] }
screencapturekit = { version = "=8.0.0", default-features = false, features = ["macos_14_0"] }
libloading = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-msmf"] }
cpal = { version = "=0.18.1", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2.0.0"

[[bin]]
name = "cef-probe"
path = "src/bin/cef_probe.rs"
required-features = ["cef-browser"]
