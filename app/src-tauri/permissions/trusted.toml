"$schema" = "schemas/schema.json"

# Application commands are denied outside this explicit permission. The
# `trusted` capability permission matches main/tray/huddle, never `gateway-*`.
[[permission]]
identifier = "trusted"
description = "Allows bundled Ducktape UI windows to call the application command surface."
commands.allow = [
  "workspace_list",
  "workspace_active",
  "gateway_route_bind",
  "gateway_route_unbind",
  "gateway_route_list",
  "gateway_open_inline",
  "gateway_inline_place",
  "gateway_inline_close",
  "gateway_inline_hide_all",
  "workspace_create",
  "workspace_join",
  "workspace_invite_blob",
  "workspace_join_requests",
  "workspace_admit",
  "workspace_promote",
  "workspace_resident_remove",
  "workspace_demote",
  "workspace_request_leave",
  "workspace_forget",
  "workspace_select",
  "workspace_phase",
  "workspace_log_tail",
  "workspace_runtime_facts",
  "user_identity_confirm_mnemonic",
  "user_identity_state",
  "user_identity_create",
  "user_identity_restore",
  "user_identity_unlock",
  "user_identity_reveal",
  "user_identity_encrypt",
  "user_identity_lock",
  "user_sign_bind",
  "user_sign_unbind",
  "user_sign_gateway_route",
  "user_sign_possession",
  "user_sign_add_member",
  "user_sign_remove_member",
  "enroll_start",
  "enroll_poll",
  "enroll_cancel",
  "forge_list_repos",
  "forge_list_branches",
  "forge_head",
  "forge_log",
  "forge_tree",
  "forge_read_file",
  "forge_read_file_page",
  "forge_diff",
  "forge_compare",
  "forge_build_merge",
  "tray_open_console",
  "tray_quit",
  "huddle_pop_out",
  "huddle_pop_in",
  "notify_configure",
  "notify_mark_seen",
  "sandbox_preflight",
]
