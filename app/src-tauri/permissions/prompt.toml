"$schema" = "schemas/schema.json"

# The consent window answers permission requests made by OTHER webviews, so it
# gets its own two commands and none of the application surface the bundled
# console holds (`trusted`). permissions.rs re-checks the window label in Rust.
[[permission]]
identifier = "permission-prompt"
description = "Allows the native permission consent window to read and answer the pending permission request."
commands.allow = [
  "permission_prompt_state",
  "permission_prompt_decide",
]
