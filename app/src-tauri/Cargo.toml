[package]
name = "ducktape-desktop"
edition.workspace = true
version.workspace = true

# the desktop shell of the ducktape app: the SAME react console the web build
# serves, in a native window. the node does NOT live here — the shell spawns
# `ducktape-noded` as a detached orphan (see src/daemon.rs) and the webview
# talks to it over the daemon's http/ws surface exactly like the web build
# does. keeping this crate free of host/module deps is the point: one node
# process, every ui a client.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the macOS menu-bar icon + popover (src/tray.rs, gated to macOS).
# image-png: decode the bundled tray.png for the icon.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# dev-only debug bridge: a local unix socket the app/scripts/tauri-debug.mjs
# helper drives (screenshot / execute_js / input). registration is cfg-gated to
# debug + desktop in main.rs so a release runtime never opens the socket.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }
