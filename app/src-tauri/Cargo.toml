[package]
name = "ducktape-desktop"
edition.workspace = true
version.workspace = true

# the desktop shell of the ducktape app: the SAME react console the web build
# serves, in a native window. the node does NOT live here — the shell spawns a
# workspace node as a detached process so closing the console can hide to the
# menu bar, then stops the active managed node on a real app quit. keeping this
# crate free of host/module deps is the point: one node process, every ui a client.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the macOS menu-bar icon + popover (src/tray.rs, gated to macOS).
# image-png: decode the bundled tray.png for the icon.
# The shell runs on the standalone tauri-runtime-cef crate (bundled Chromium)
# against REGISTRY tauri — wry is fully replaced (default-features off drops
# wry/x11/dbus; compression + dynamic-acl are kept from the defaults). The
# runtime is wired explicitly — Builder::<rt::Cef> plus the rt.rs aliases —
# and main() dispatches CEF subprocesses to run_cef_helper_process, since
# registry tauri has no cef feature, Cef alias, or cef_entry_point macro.
# unstable: tauri's multiwebview API (Window::add_child) for the inline
# gateway view (gateway_window.rs).
tauri = { version = "2", default-features = false, features = [
  "unstable",
  "compression",
  "dynamic-acl",
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
# Rev-pinned like the plugin above: bump deliberately (push to the repo,
# update the rev, rebuild to refresh Cargo.lock).
# macos-private-api must stay in sync with the tauri feature above: tauri only
# forwards it to tauri-runtime-wry, so an out-of-tree runtime has to be synced
# by hand or macOS builds fail E0046 (WindowBuilder::transparent required by
# the trait but cfg'd out of the impl).
tauri-runtime-cef = { git = "https://github.com/byeongsu-hong/tauri-runtime-cef", rev = "86591aa0afb6da9afcd7f4d80c95f34555692b08", features = [
  "macos-private-api",
] }
# native OS toasts for the production notification sink (src/notify/present.rs).
tauri-plugin-notification = "2"
# in-app LAN key-enrollment server (pure Rust, no system libs): an ephemeral,
# session-token-gated HTTP relay a phone hits over the Wi-Fi LAN to enroll a key.
tiny_http = "0.12"
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
toml = "0.8"
# notify/stream.rs: the async ws client of the node's typed /v1/ws stream.
# tokio-tungstenite deliberately builds without TLS features — the stream dials
# the local workspace node over plain localhost http.
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zeroize = { workspace = true }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# dev-only debug bridge: the tauri-agent debugger plugin the app/scripts/tauri-agent
# CLI / tauri-agent MCP server drive (semantic tree / input / DOM-SVG shot / logs).
# registration is cfg-gated to debug + desktop in main.rs so a release runtime
# registers nothing.
# Git-pinned past the 0.0.1 release for the multiwebview fix (plugin#39/PR#40):
# tauri's webview_windows() evicts a window once add_child gives it a second
# webview, which killed the bridge whenever the inline gateway tab opened. The
# JS guest (@byeongsu-hong/tauri-plugin-agent) is unchanged — npm stays 0.0.1.
# Move the pin to a release once PR#40 merges and ships.
tauri-plugin-agent = { git = "https://github.com/byeongsu-hong/tauri-agent-plugin", rev = "c1f65f1df2bc039ac24546d198d73eade426523a" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
