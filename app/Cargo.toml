[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false
description = "A local-first consensus workspace for people and agents"
authors = ["Ducktape contributors"]

[package.metadata.ice.bundle]
icon = "assets/icon.svg"
category = "public.app-category.productivity"

# macOS terminates the process the instant a huddle opens a device whose reason
# the bundle does not state; these are the sentences its prompt shows. Screen
# capture has no usage key — macOS grants it through Screen Recording instead.
[package.metadata.ice.bundle.usage]
camera = "Ducktape uses the camera for video in huddles."
microphone = "Ducktape uses the microphone for voice in huddles."

[build-dependencies]
ui-lang-build = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764", version = "=0.1.0" }

[dependencies]
# the network's node -> announced-provider registry, behind the Shell's host
# picker: which peers can actually run an agent.
capability.workspace = true
chat.workspace = true
# the huddle media planes: the call-socket framing and voice/video wire.
media-service.workspace = true
design.workspace = true
ducktape-rpc.workspace = true
forge.workspace = true
gateway.workspace = true
# the client-computed merge lane: a bare mirror fetched over the node's
# /forge/{repo} smart-HTTP bridge + the scratch merge commit MergePr CASes.
# forge's exact pin (vendored, no TLS transports — the bridge speaks plain
# http on loopback/LAN; probed against a live node before adoption).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
governance.workspace = true
# THE ducktape home resolution (`$DUCKTAPE_HOME` else `~/.ducktape`), in a
# zero-dependency leaf so every reader of that root agrees about it.
ducktape-home.workspace = true
identity.workspace = true
inbox.workspace = true
# THE device keystore, linked rather than spawned. Opening your own key is the
# app's own business: it used to reach argon2id by starting `ducktape` and
# piping to it, which made "can this process find a binary on disk?" a
# precondition for unlocking a wallet — and the sentence a person got when it
# could not was about checking their install.
keystore.workspace = true
# the signed op frame `/v1/submit/frame` takes. Signing one is the other half
# of holding the key in-process; `node::encode_frame` is the ONE encoder, and a
# second implementation of a machine wire format is not a thing to write.
node.workspace = true
authpage.workspace = true
# the ed25519 signer `keystore` hands back and `node::encode_frame` signs with.
commonware-cryptography.workspace = true
# scheduling a durable agent run in-process: the work spec the saga carries and
# the run envelope's headless composer. `run-envelope` is the SCHEMA only —
# reaching the composer through `compute-service` would link provider-host and
# the microVM sandbox into a GUI.
dispatch.workspace = true
run-envelope.workspace = true
# the 32 random bytes of a fresh dispatch id.
rand.workspace = true
pages.workspace = true
saga.workspace = true
# RUNTIME, not dev-only: `local_member` derives the signing identity through
# `sdk::Origin::External(..).actor_string()` on the product path, so a
# dev-dependency here builds every TEST lane and breaks only the BINARY.
sdk.workspace = true
# The join ceremony, linked rather than spawned. Joining is the one node
# operation with no daemon to ask — it is what BRINGS a workspace into
# existence — so the app runs it here instead of shelling out to
# `ducktape node join` and diffing the workspace registry to find out which
# directory the child had created.
workspace-config.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The huddle's media leg (`src/call.rs`): microphone/speaker streams and the
# `/v1/call/ws` socket the node's call hub serves.
cpal = "0.15"
tokio-tungstenite = "0.24"
# The camera leg (`src/video.rs`): capture + the pure-Rust intra-only JPEG
# codec v1 (see the module doc for the codec seam).
nokhwa = { version = "0.10", features = ["input-native"] }
# The screen-share leg (`src/video.rs`): a root-window grab over X11. Already
# in this binary under winit, and pure Rust — the portal/pipewire route would
# put a build-time system library on every machine that builds this app, to
# reach a compositor iced is not built for here (`x11`, no `wayland`).
x11rb = "0.13"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
# The picture viewer (`src/backend/picture.rs`) decodes to RGBA off-thread;
# iced itself stays codec-less (`image-without-codecs`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The same viewer validates and measures an SVG before handing it to iced's
# `svg` widget (resvg draws it); usvg is already in the graph under resvg.
usvg = "0.45"
# A web picture in forge Markdown is one capped GET (`web_picture_bytes`);
# the workspace's reqwest is already in the binary under rpc-client.
reqwest.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
# The app's own diagnostics: `main.rs` installs ONE subscriber over
# `<DUCKTAPE_HOME>/app.log` (rotated at open by `node::log_file`, the same
# opener as the node's daemon.log) plus a panic hook that lands there. Every
# failure a person must act on is still a plate on screen; the file is what a
# member attaches to an issue when the plate is not enough.
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# the device key's name is the host's (`device_key_name`); a kernel call
# works on every OS the app runs on.
gethostname = "1"
zeroize.workspace = true
# `fira-sans` is the wasm view modules' font: a module lays its text out
# in the guest against the one family embedded there, and the host must
# replay those lines with the same faces or every run lands a few pixels off.
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "fira-sans", "highlighter", "image-without-codecs", "lazy", "markdown", "svg", "tokio", "wgpu", "x11"] }
ui-lang-components = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764", default-features = false, features = ["log-timeline", "terminal"] }
ui-lang = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764" }
ui-lang-runtime = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764", version = "=0.1.0", default-features = false, features = ["full-runtime"] }
# A module's view runs as wasm inside the app (`src/backend/wasm_view.rs`):
# the wire is what crosses between the guest and the widget that shows it,
# and wasmtime — the workspace's one pinned runtime — runs the module.
ui-lang-wire = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764", version = "=0.1.0" }
wasmtime.workspace = true

# The native notification leg (`src/backend/notify.rs`): being @mentioned or
# DM'd raises a real macOS banner, not just the in-app bell. objc2 0.5 and
# objc2-app-kit 0.2 are already in this binary's graph under winit — these
# only turn on the classes this file names. UNUserNotificationCenter TERMINATES
# a process with no bundle identifier, so `notify` reads NSBundle first and a
# bare binary (every `cargo test`) degrades to a debug! line.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSRunningApplication"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationTrigger"] }

[dev-dependencies]
commonware-cryptography.workspace = true
# `src/frame_probe.rs` needs a headless `UserInterface` to measure a whole
# frame (build + layout + event walk + draw), and iced does not re-export
# `iced_runtime`. The explicit test-only ui-lang runtime feature below keeps
# that renderer out of the product dependency surface.
iced_test = "=0.14.0"
simnode = { path = "../bin/simnode" }
tempfile.workspace = true
ui-lang-runtime = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "f18bfe648b26f1d032f6a33ba441fdf66305e764", version = "=0.1.0", default-features = false, features = ["test-runtime"] }
