[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
chat.workspace = true
design.workspace = true
ducktape-rpc.workspace = true
forge.workspace = true
# the client-computed merge lane: a bare mirror fetched over the node's
# /forge/{repo} smart-HTTP bridge + the scratch merge commit MergePr CASes.
# forge's exact pin (vendored, no TLS transports — the bridge speaks plain
# http on loopback/LAN; probed against a live node before adoption).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
governance.workspace = true
identity.workspace = true
inbox.workspace = true
pages.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zeroize.workspace = true
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "svg", "tokio", "wgpu", "x11"] }
ducktape-ui = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "f8a7ee3", default-features = false, features = ["full"] }
# RUNTIME, not dev-only: `local_member` derives the signing identity through
# `sdk::Origin::External(..).actor_string()` on the product path. It sat under
# dev-dependencies while a non-test caller used it, which builds the TEST target
# and breaks the BINARY — invisible to `cargo test -p ducktape-app`.
sdk.workspace = true
ui-lang = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "f8a7ee3" }
ui-lang-runtime = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "f8a7ee3", version = "=0.1.0" }

[dev-dependencies]
commonware-cryptography.workspace = true
node.workspace = true
simnode = { path = "../bin/simnode" }
tempfile.workspace = true
