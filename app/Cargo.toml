[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
chat.workspace = true
ducktape-rpc.workspace = true
pages.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zeroize.workspace = true
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tokio", "wgpu", "x11"] }
ui-lang = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "67a1340c5f66012df81867c8dd094b5f01495c1e" }
ui-lang-runtime = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "67a1340c5f66012df81867c8dd094b5f01495c1e", version = "=0.1.0" }

[dev-dependencies]
commonware-cryptography.workspace = true
node.workspace = true
sdk.workspace = true
simnode = { path = "../bin/simnode" }
tempfile.workspace = true
