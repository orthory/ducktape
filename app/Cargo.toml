[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
chat.workspace = true
ducktape-rpc.workspace = true
governance.workspace = true
identity.workspace = true
inbox.workspace = true
pages.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zeroize.workspace = true
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tokio", "wgpu", "x11"] }
ui-lang = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "5a17c58ad71ee0b3386662919069e4aa7a3e5af2" }
ui-lang-runtime = { git = "https://github.com/byeongsu-hong/ducktape-ui-lang.git", rev = "5a17c58ad71ee0b3386662919069e4aa7a3e5af2", version = "=0.1.0" }

[dev-dependencies]
commonware-cryptography.workspace = true
node.workspace = true
sdk.workspace = true
simnode = { path = "../bin/simnode" }
tempfile.workspace = true
