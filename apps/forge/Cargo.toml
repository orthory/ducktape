[package]
name = "forge"
edition.workspace = true
version.workspace = true

# a git-backed module: state is a real git repo, root() is its HEAD oid.
# depends only on sdk + its own interface (+ sha2 for the sha1-fallback mapping).
[dependencies]
sdk = { workspace = true }
forge-interface = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# dev-only: prove forge's root composes into the global app-hash. not a
# production dep — a module still depends on sdk + its interface only.
state = { workspace = true }
futures = "0.3"
