<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- macOS icon grid convention: the rounded-square artwork occupies ~80% of the
       canvas, with ~10% transparent margin on every side. We keep the full 256
       artwork below and scale it to 80% (204.8px) centered via this group, leaving
       25.6px (=10% of 256) of transparent padding per side. translate(25.6,25.6)
       re-centers the shrunk artwork. -->
  <g transform="translate(25.6,25.6) scale(0.8)">
    <rect width="256" height="256" rx="56" fill="#f5b301" />
    <!-- Duck moved to DEAD CENTER of the tile: its bbox center was (121.5, 105.5),
         so translate(6.5, 22.5) lands it at (128, 128). -->
    <path
      transform="translate(6.5,22.5)"
      d="M170 96c0-23-19-42-42-42-9 0-18 3-25 8L70 44c-6-5-15 1-13 8l9 34c-6 8-10 18-10 30 0 31 25 56 56 56h58c10 0 18-8 18-18s-8-18-18-18h-12c14-6 24-20 24-36Zm-58-14a10 10 0 1 1 0 20 10 10 0 0 1 0-20Z"
      fill="#1a1a1a"
    />
  </g>
</svg>
