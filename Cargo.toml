# super-app workspace — a consensus platform of isolated modules. each module
# publishes its wire surface (types-only payload/query/reply shapes + codecs)
# at its crate root; cross-module product interaction goes through those wire
# types and host-mediated queries, never another module's internals.
# three layers: module / kernel / networking — the tree groups by function,
# not mechanism ("system" always means system *modules*). layout:
#   crates/kernel/   — the platform: sdk (the module contract + sdk::codec),
#                      sdk-testkit (dev-only test doubles for the sdk boundary
#                      traits), host (submit/execute loop, root-hash composition,
#                      the host::worker seam), node (ordered replication),
#                      consensus (BFT orderer), statesync, recovery, indexer,
#                      blobstore (node-local receipt-lane byte store — like
#                      indexer, never in any root), wasm-host (runs a
#                      ducktape:module component as a native sdk::Module),
#                      module-guest (that world's WIT definition)
#   crates/networking/ — the netstack: host-side transport infra ONLY
#                      (wireguard, nat-traversal, reachability, data-plane,
#                      overlay-net) — owns no consensus module
#   crates/modules/   — CONSENSUS MODULES AND NOTHING ELSE. every crate under
#                      system/ or apps/ implements `sdk::Module`; anything that
#                      does not belongs somewhere else in this list. (module =
#                      onchain, service = offchain.)
#   crates/modules/system/ — system modules: consensus infrastructure (kv,
#                      valset, governance, identity, lifecycle, saga,
#                      capability, dispatch, tagging, gateway — which absorbed
#                      the duckdns naming library it now consumes from
#                      crates/duckdns)
#   crates/modules/apps/   — application modules, the product features (forge,
#                      chat, pages, agent, runs, tasks, vaults, automations,
#                      inbox, files)
#   crates/services/ — off-chain service crates: the host-side executors that
#                      serve a consensus module without being one (compute —
#                      the dispatch WorkSpec pool/ledger/gate; sandbox — the
#                      node-local podman/egress/backend-probe muscle; broker —
#                      the run-scoped credential loopback + airlock client;
#                      provider — the executor spec layer + CliProvider run loop;
#                      agent — the pty session daemon; airlock — the lender)
#   crates/airlock/  — the two-party execution/auth contract (see members below)
#   crates/duckdns/  — the `.duck` account naming library: hostname grammar,
#                      handle registry, wire types. NOT a module — the `gateway`
#                      module embeds it and owns the onchain half, while the
#                      four composing binaries parse/validate names host-side,
#                      so it sits beside the other cross-plane libraries rather
#                      than under the one module that happens to wrap it
#   crates/duckfs/   — the versioned-filesystem engine: core (pure, wasm-ready
#                      — the `files` module wraps it), disk, client (OS-side)
#   crates/guests/   — shared wasm-port infra ONLY: guest-adapter (the
#                      ducktape:module world binding every port shares), the
#                      wasm32 dep stubs, and the kernel-fixture test guests
#                      (hello, hello-replacement, sibling, object). every module
#                      carries its OWN port (src/guest.rs behind the `guest`
#                      feature) and bin/guest-builder synthesizes the
#                      packaging — no per-module crate lives here
#   crates/examples/ — reference modules: directory (also bin/node's liveness
#                      canary), greeter (the types-only composition example)
#   crates/testing/  — dev-only shared test support (nettest: raw-http client,
#                      port allocation, poll). [dev-dependencies] of the bin
#                      integration suites ONLY; no shipping crate depends on it
#   crates/labs/     — quarantined experimental consensus modules (evm,
#                      multisig): in-tree and tested but registered by NO
#                      genesis set. EXCLUDED from the workspace as its own
#                      standalone crate so its heavy deps (revm, alloy) never
#                      tax the shipping build; gated via `make labs-gate`
#   bin/             — demo (in-process walkthrough), node (the `ducktape`
#                      CLI: validator + fs verbs + mcp server), noded (the
#                      app-facing daemon), simnode (deterministic /v1 twin),
#                      coordinator (STUN rendezvous), guest-builder (module →
#                      wasm component packaging tool)
# the host dispatches modules over BFT consensus and composes each authenticated
# root into the global root-hash. cosmwasm's isolation *pattern*, native rust.

[workspace]
resolver = "2"
members = [
    # kernel — the platform (contract + dispatch + transport + BFT ordering)
    "crates/kernel/sdk", "crates/kernel/sdk-testkit", "crates/kernel/host",
    "crates/kernel/node", "crates/kernel/consensus",
    "crates/kernel/statesync", "crates/kernel/recovery", "crates/kernel/indexer",
    "crates/kernel/index-guest",
    # the node-local receipt-lane byte store. platform, not a module: it holds
    # no consensus state and lands in no root — the same standing `indexer` has
    # two lines up, and the reason it left crates/modules/system/.
    "crates/kernel/blobstore",
    "crates/kernel/wasm-host",
    # networking — the netstack (host-side infra + the modules that govern it)
    "crates/networking/wireguard",
    "crates/networking/nat-traversal",
    "crates/networking/reachability",
    "crates/networking/data-plane",
    "crates/networking/overlay-net",
    # modules/system — system modules. every entry implements `sdk::Module`.
    "crates/modules/system/kv",
    "crates/modules/system/valset",
    "crates/modules/system/governance",
    "crates/modules/system/identity",
    "crates/modules/system/lifecycle",
    "crates/modules/system/saga",
    "crates/modules/system/capability",
    "crates/modules/system/dispatch",
    "crates/modules/system/tagging",
    "crates/modules/system/gateway",
    # airlock — the two-party execution/auth contract. NOT a consensus module
    # (no MODULE_ID, no guest wasm): a protocol shared by the lender service,
    # the borrower broker and the enclave binary, so it sits beside the other
    # cross-plane protocol families rather than under any one party.
    "crates/airlock",
    # duckdns — the `.duck` naming library, same standing for the same reason.
    # NOT a consensus module (no `sdk::Module`, no MODULE_ID, no guest wasm):
    # `gateway` absorbed the onchain half and embeds this registry, while
    # node/noded/simnode/demo parse and validate `.duck` names host-side. Under
    # crates/modules/system/ it made "modules = onchain" literally false.
    "crates/duckdns",
    "crates/duckfs/core",
    "crates/duckfs/disk",
    "crates/duckfs/client",
    "crates/rpc-client",
    # desktop-only font assets and the product typography contract
    "crates/design",
    # apps — product feature modules
    "crates/modules/apps/forge",
    "crates/modules/apps/pages",
    "crates/modules/apps/chat",
    "crates/modules/apps/agent",
    "crates/modules/apps/runs",
    "crates/modules/apps/tasks",
    "crates/modules/apps/vaults",
    "crates/modules/apps/automations",
    "crates/modules/apps/inbox",
    "crates/modules/apps/files",
    # services — off-chain host-side executors
    "crates/services/agent",
    "crates/services/airlock",
    "crates/services/broker",
    "crates/services/compute",
    "crates/services/provider",
    "crates/services/sandbox",
    # examples — demo / test scaffolding modules
    "crates/examples/directory", "crates/examples/greeter",
    # testing — dev-only shared harness helpers (raw-http client, ports,
    # poll). NOT a Module Rule surface; no shipping crate depends on it.
    "crates/testing/nettest",
    # bin — runnable binaries
    "bin/demo", "bin/node", "bin/noded", "bin/simnode", "bin/coordinator",
    "bin/airlock-gateway",
    "bin/guest-builder",
    # native desktop client — intentionally only Chat + Pages
    "app",
]
# labs is a standalone crate (its own [workspace] + Cargo.lock), NOT a member:
# its quarantined evm/multisig deps (revm, alloy) must never enter — or slow —
# the shipping workspace build. It stays in-tree and is gated via `make labs-gate`.
exclude = ["crates/labs", "crates/guests/guest-adapter"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# the ducktape CLI's argument grammar (derive). already in the graph
# transitively, so this costs no new compilation unit.
clap = { version = "4.6", features = ["derive"] }
# the logging facade. events land in `noded::LogRing` (streamed to the app's
# Logs tab over the ws `logs` topic) AND on stderr (tee'd to daemon.log) —
# both gated by ONE reloadable filter, see bin/noded/src/log.rs.
tracing = "0.1"
arrayvec = "0.7"
crossbeam-channel = "0.5"
lru = "0.18"
smallvec = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# revm + alloy-primitives are NOT here on purpose: they are quarantined as
# direct pinned deps in crates/labs/Cargo.toml (the standalone labs crate), so
# the shipping workspace never builds the EVM dep tree. See labs-gate.
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
rand = "0.8"
# Opus codec (voice) — pure Rust, no C toolchain. No FEC-decode / PLC in the
# decoder (empty input errors), so the voice engine renders lost frames as
# silence; see crates/modules/apps/chat/src/voice.
opus-rs = "0.1"

# commonware — one ecosystem, version-aligned (see auto-memory reference_qmdb_commonware).
commonware-storage = "2026.5.0"
commonware-runtime = "2026.5.0"
commonware-cryptography = "2026.5.0"
commonware-codec = "2026.5.0"
# the simplex BFT stack — used by the `consensus` crate (the real orderer);
# pinned here so every commonware crate stays on the one version.
commonware-consensus = "2026.5.0"
commonware-resolver = "2026.5.0"
commonware-p2p = "2026.5.0"
commonware-parallel = "2026.5.0"
commonware-utils = "2026.5.0"
commonware-actor = "2026.5.0"
defguard_wireguard_rs = "0.10.0"
# the userspace overlay backend (overlay-net/userspace): the SAME BoringTun
# core the TUN path already runs (defguard_wireguard_rs's fork), used sans-io
# (`noise::Tunn`, no device layer) — wire compat between socket-mode and
# tun-mode nodes is by construction, not by hope. version pinned to the one
# defguard_wireguard_rs 0.10 resolves, so both paths share one build of the
# crypto core.
defguard_boringtun = "0.6.5"
# the userspace backend's virtual host: a TUN-less TCP/UDP stack terminating
# at the node's overlay ULA, entirely in-process. `medium-ip` because the
# tunnel carries raw IP (WireGuard has no link layer), `async` for the
# waker-based socket surface.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ip", "proto-ipv6", "socket-udp", "socket-tcp", "async",
] }
# the node's own WireGuard identity is X25519 (WireGuard's curve, not the
# ed25519 signer's); static_secrets because the key persists across boots.
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
p256 = "0.13"
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"
# tests only: isolated on-disk module data dirs.
tempfile = "3"
# user-key v1 at-rest custody (bin/node/src/userkey.rs only): BIP39
# wordlist + entropy checksum (the PBKDF2 `to_seed` path is deliberately
# unused — see the identity-onboarding design doc's custody model),
# argon2id KEK derivation, and XChaCha20-Poly1305 AEAD. zeroize scrubs the
# derived key on drop.
bip39 = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"

# fluent31 — the derived read-model engine (LSM + MVCC snapshots) behind the
# per-module indexer tier ONLY: nothing the root-hash commits to may live in it
# (evaluated and rejected as a canonical substrate — see handoff/restart-recovery.md).
# default-features = false keeps the base dep lean; the indexer crate turns the
# `wasm` feature on — the in-database WASM layer (wasmtime) runs the per-module
# index guests (fold triggers + view queries).
fluent31 = { git = "https://github.com/orthory/fluent31", default-features = false }
# fluent-guest — fluent31's wasm32 guest SDK. NEVER a host-side dependency:
# only the index-guest crate's `guest` feature pulls it, and only guest-builder's
# synthesized wasm32 workspaces ever enable that feature.
fluent-guest = { git = "https://github.com/orthory/fluent31", default-features = false }
# borsh — the deterministic op-row envelope on the derived tier's fold feed
# (host encodes, index guests decode; one byte layout, no map ordering games).
borsh = { version = "1", default-features = false, features = ["derive", "std"] }

# wasmtime — the frozen-substrate wasm runtime that executes hot-swappable
# modules inside the host. pinned EXACTLY: the runtime IS the module execution
# semantics, so it is consensus-affecting and every validator must run the
# identical build; changing it is a binary upgrade, never a live module swap.
wasmtime = "=46.0.1"

# internal — kernel crates (the platform)
sdk = { path = "crates/kernel/sdk" }
# dev-only shared test doubles for the sdk boundary traits (TestCtx +
# in-memory MerkleStore). MAY ONLY appear in `[dev-dependencies]` of consumers —
# the Module Rule (modules link only sdk + wire surfaces) is untouched.
sdk-testkit = { path = "crates/kernel/sdk-testkit" }
host = { path = "crates/kernel/host" }
node = { path = "crates/kernel/node" }
consensus = { path = "crates/kernel/consensus" }
statesync = { path = "crates/kernel/statesync" }
recovery = { path = "crates/kernel/recovery" }
indexer = { path = "crates/kernel/indexer" }
blobstore = { path = "crates/kernel/blobstore" }
# keyed with the underscore ON PURPOSE: module crates declare a feature named
# `index-guest` (the guest-builder --index contract), and cargo refuses a
# feature sharing its name with a non-optional dependency key.
index_guest = { path = "crates/kernel/index-guest", package = "index-guest" }
wasm-host = { path = "crates/kernel/wasm-host" }
# per-module materialized views on the derived tier (indexer + the module's
# types-only interface crate — never the module impl).
# internal — module impl crates
kv = { path = "crates/modules/system/kv" }
valset = { path = "crates/modules/system/valset" }
governance = { path = "crates/modules/system/governance" }
identity = { path = "crates/modules/system/identity" }
lifecycle = { path = "crates/modules/system/lifecycle" }
saga = { path = "crates/modules/system/saga" }
capability = { path = "crates/modules/system/capability" }
dispatch = { path = "crates/modules/system/dispatch" }
tagging = { path = "crates/modules/system/tagging" }
gateway = { path = "crates/modules/system/gateway" }
forge = { path = "crates/modules/apps/forge" }
design = { path = "crates/design" }
pages = { path = "crates/modules/apps/pages" }
chat = { path = "crates/modules/apps/chat" }
agent = { path = "crates/modules/apps/agent" }
runs = { path = "crates/modules/apps/runs" }
tasks = { path = "crates/modules/apps/tasks" }
vaults = { path = "crates/modules/apps/vaults" }
automations = { path = "crates/modules/apps/automations" }
inbox = { path = "crates/modules/apps/inbox" }
files = { path = "crates/modules/apps/files" }
# internal — off-chain service crates
agent-service = { path = "crates/services/agent" }
airlock-service = { path = "crates/services/airlock" }
broker-host = { path = "crates/services/broker" }
compute-service = { path = "crates/services/compute" }
provider-host = { path = "crates/services/provider" }
sandbox-host = { path = "crates/services/sandbox" }
# internal — cross-plane libraries: neither a consensus module nor a service.
# duckdns is the `.duck` naming library the `gateway` module embeds and the
# composing binaries validate names through (see the members list).
duckdns = { path = "crates/duckdns" }
duckfs-core = { path = "crates/duckfs/core" }
duckfs-disk = { path = "crates/duckfs/disk" }
duckfs-client = { path = "crates/duckfs/client" }
ducktape-rpc = { path = "crates/rpc-client" }
directory = { path = "crates/examples/directory" }
greeter = { path = "crates/examples/greeter" }
# internal — types-only interface crates (the legal cross-module surface)
wireguard = { path = "crates/networking/wireguard" }
nat-traversal = { path = "crates/networking/nat-traversal" }
reachability = { path = "crates/networking/reachability" }
data-plane = { path = "crates/networking/data-plane" }
overlay-net = { path = "crates/networking/overlay-net" }

# overlay-net's wrapper context implements commonware-runtime's `Clock` and
# rng bounds, whose supertraits live in these crates — pinned to the exact
# versions commonware-runtime 2026.5.0 depends on (a different semver-major
# would be a different trait).
governor = "0.10.2"
rand_core = "0.6.4"

[patch.crates-io]
# `block` 0.1.6 is still required transitively by Metal and AVFoundation, but
# its uninhabited extern-static type is future-incompatible with Rust. Keep the
# API/ABI identical and patch only that declaration locally.
block = { path = "patches/block" }

# dev/test builds compile wasm guests through cranelift (consensus components
# in the kernel tests, index guests at every store open). unoptimized
# cranelift is 10-30x slower — enough that a fleet of e2e daemons booting
# concurrently blows readiness deadlines — so the code generator itself is
# always built optimized. build-time only; artifacts and semantics unchanged.
# The desktop app's view is one generated function big enough that LLVM's DWARF
# emitter segfaults on it (rustc 1.96, `-C debuginfo=2`). Dropping debug info for
# this crate alone keeps the rest of the workspace debuggable — and takes the
# dev binary from ~516 MB to a fraction of that.
[profile.dev.package.ducktape-app]
debug = 0

# `make dev` runs the desktop app under the dev profile, and an unoptimized
# GUI stack is a lag machine on its own: cosmic-text shapes every glyph run
# ~10x slower and iced re-lays the whole tree per frame. Optimizing ONLY the
# render/text/gpu dependency stack keeps workspace crates fast to compile
# (a `package."*"` wildcard would drag the node's wasmtime universe to O2,
# which this box cannot compile reliably — #887).
[profile.dev.package.iced]
opt-level = 2

[profile.dev.package.iced_core]
opt-level = 2

[profile.dev.package.iced_debug]
opt-level = 2

[profile.dev.package.iced_futures]
opt-level = 2

[profile.dev.package.iced_graphics]
opt-level = 2

[profile.dev.package.iced_program]
opt-level = 2

[profile.dev.package.iced_renderer]
opt-level = 2

[profile.dev.package.iced_runtime]
opt-level = 2

[profile.dev.package.iced_selector]
opt-level = 2

[profile.dev.package.iced_tiny_skia]
opt-level = 2

[profile.dev.package.iced_wgpu]
opt-level = 2

[profile.dev.package.iced_widget]
opt-level = 2

[profile.dev.package.iced_winit]
opt-level = 2

[profile.dev.package.winit]
opt-level = 2

[profile.dev.package.lilt]
opt-level = 2

[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.cryoglyph]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.yazi]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.lyon]
opt-level = 2

[profile.dev.package.lyon_algorithms]
opt-level = 2

[profile.dev.package.lyon_geom]
opt-level = 2

[profile.dev.package.lyon_path]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

[profile.dev.package.softbuffer]
opt-level = 2


[profile.dev.package.cranelift-codegen]
