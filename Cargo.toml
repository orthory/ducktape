# super-app workspace — a consensus platform of isolated modules. a module crate
# depends ONLY on `sdk` + the types-only `*-interface` crates of modules it talks
# to — never another module's impl. layout:
#   system/  — consensus infrastructure modules (kv state primitive, valset)
#   apps/    — product features / "apps" (forge; future document, chat, tasks)
#   demo-modules/ — demo + test scaffolding (directory, greeter), NOT products
# the host dispatches modules over BFT consensus and composes each authenticated
# root into the global app-hash. cosmwasm's isolation *pattern*, native rust.

[workspace]
resolver = "2"
members = [
    "sdk", "state", "host",
    "system/kv", "system/kv-interface",
    "system/valset", "system/valset-interface",
    "apps/forge", "apps/forge-interface",
    "demo-modules/directory", "demo-modules/directory-interface", "demo-modules/greeter",
    "node",
    "consensus",
    "demo",
    "node-bin",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

# commonware — one ecosystem, version-aligned (see auto-memory reference_qmdb_commonware).
commonware-storage = "2026.5.0"
commonware-runtime = "2026.5.0"
commonware-cryptography = "2026.5.0"
commonware-codec = "2026.5.0"
# the simplex BFT stack — used by the `consensus` crate (the real orderer);
# pinned here so every commonware crate stays on the one version.
commonware-consensus = "2026.5.0"
commonware-p2p = "2026.5.0"
commonware-parallel = "2026.5.0"
commonware-utils = "2026.5.0"
commonware-actor = "2026.5.0"

# internal — impl crates
sdk = { path = "sdk" }
state = { path = "state" }
host = { path = "host" }
kv = { path = "system/kv" }
directory = { path = "demo-modules/directory" }
greeter = { path = "demo-modules/greeter" }
forge = { path = "apps/forge" }
valset = { path = "system/valset" }
node = { path = "node" }
consensus = { path = "consensus" }
# internal — types-only interface crates (the legal cross-module surface)
kv-interface = { path = "system/kv-interface" }
directory-interface = { path = "demo-modules/directory-interface" }
forge-interface = { path = "apps/forge-interface" }
valset-interface = { path = "system/valset-interface" }
