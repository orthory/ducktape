# super-app workspace — a consensus platform of isolated modules. module crates
# normally depend only on `sdk` + the types-only `*-interface` crates of modules
# they talk to. wrapper modules such as chat/agent may reuse a shared storage
# implementation either as a private embedded substrate or as a facade over an
# explicitly registered backing module. embedded durable state must be committed
# through the wrapper's root()/commit/abort/sync surface; registered backing state
# belongs to the backing module's root. cross-module product interaction still
# goes through interface crates, not another module's implementation API. layout:
#   crates/kernel/   — the platform: sdk (interface), state (app-hash), host
#                      (dispatch), node (transport seam), consensus (BFT orderer)
#   crates/system/   — consensus infrastructure modules (kv, valset)
#   crates/apps/     — product feature modules (forge; future document, chat, tasks)
#   crates/examples/ — demo + test scaffolding modules (directory, greeter)
#   bin/             — runnable binaries (in-process demo, real-socket node)
# the host dispatches modules over BFT consensus and composes each authenticated
# root into the global app-hash. cosmwasm's isolation *pattern*, native rust.

[workspace]
resolver = "2"
members = [
    # kernel — the platform (contract + dispatch + transport + BFT ordering)
    "crates/kernel/sdk", "crates/kernel/state", "crates/kernel/host",
    "crates/kernel/node", "crates/kernel/consensus", "crates/kernel/reactor",
    # system — consensus infrastructure modules
    "crates/system/kv", "crates/system/kv-interface",
    "crates/system/valset", "crates/system/valset-interface",
    "crates/system/valset-mesh-interface",
    "crates/system/saga", "crates/system/saga-interface",
    # apps — product feature modules
    "crates/apps/forge", "crates/apps/forge-interface",
    "crates/apps/document", "crates/apps/document-interface",
    "crates/apps/messaging", "crates/apps/messaging-interface",
    "crates/apps/chat", "crates/apps/chat-interface",
    "crates/apps/agent", "crates/apps/agent-interface",
    "crates/apps/tasks", "crates/apps/tasks-interface",
    # examples — demo / test scaffolding modules
    "crates/examples/directory", "crates/examples/directory-interface", "crates/examples/greeter",
    # bin — runnable binaries
    "bin/demo", "bin/node",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

# commonware — one ecosystem, version-aligned (see auto-memory reference_qmdb_commonware).
commonware-storage = "2026.5.0"
commonware-runtime = "2026.5.0"
commonware-cryptography = "2026.5.0"
commonware-codec = "2026.5.0"
# the simplex BFT stack — used by the `consensus` crate (the real orderer);
# pinned here so every commonware crate stays on the one version.
commonware-consensus = "2026.5.0"
commonware-resolver = "2026.5.0"
commonware-p2p = "2026.5.0"
commonware-parallel = "2026.5.0"
commonware-utils = "2026.5.0"
commonware-actor = "2026.5.0"

# internal — kernel crates (the platform)
sdk = { path = "crates/kernel/sdk" }
state = { path = "crates/kernel/state" }
host = { path = "crates/kernel/host" }
node = { path = "crates/kernel/node" }
consensus = { path = "crates/kernel/consensus" }
reactor = { path = "crates/kernel/reactor" }
# internal — module impl crates
kv = { path = "crates/system/kv" }
valset = { path = "crates/system/valset" }
saga = { path = "crates/system/saga" }
forge = { path = "crates/apps/forge" }
document = { path = "crates/apps/document" }
messaging = { path = "crates/apps/messaging" }
chat = { path = "crates/apps/chat" }
agent = { path = "crates/apps/agent" }
tasks = { path = "crates/apps/tasks" }
directory = { path = "crates/examples/directory" }
greeter = { path = "crates/examples/greeter" }
# internal — types-only interface crates (the legal cross-module surface)
kv-interface = { path = "crates/system/kv-interface" }
valset-interface = { path = "crates/system/valset-interface" }
valset-mesh-interface = { path = "crates/system/valset-mesh-interface" }
saga-interface = { path = "crates/system/saga-interface" }
forge-interface = { path = "crates/apps/forge-interface" }
document-interface = { path = "crates/apps/document-interface" }
messaging-interface = { path = "crates/apps/messaging-interface" }
chat-interface = { path = "crates/apps/chat-interface" }
agent-interface = { path = "crates/apps/agent-interface" }
tasks-interface = { path = "crates/apps/tasks-interface" }
directory-interface = { path = "crates/examples/directory-interface" }
