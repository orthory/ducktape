[package]
name = "airlock-cli"
edition.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "airlock-cli"
path = "src/main.rs"

[dependencies]
airlock = { path = "../../crates/system/airlock", features = ["client", "verify"] }
anyhow = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
