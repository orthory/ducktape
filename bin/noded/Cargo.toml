[package]
name = "noded"
edition.workspace = true
version.workspace = true

# the ducktape node daemon: owns ONE embedded `host::Host` on a dedicated
# actor thread (the host is deliberately non-Send) and exposes it to clients
# over http + websocket — POST /v1/submit (one msg = one block), POST /v1/query
# (read committed state), GET /v1/status (version + app-hash + module roots),
# POST /v1/admin/shutdown (graceful exit), GET /v1/ws (a block-finalized event
# stream). every ducktape app build is a client of this process: the web build
# dials it directly; the native Iced build spawns or adopts its managed
# workspace process and talks to it over the same HTTP/WebSocket contract.
[[bin]]
name = "ducktape-noded"
path = "src/main.rs"

[dependencies]
# streamed gateway response bodies (GatewayBody chunks + Body::from_stream relay).
bytes = "1"
tokio-stream = "0.1"
# the host-side qmdb store handle injected into disk-backed modules.
statesync = { workspace = true }
host = { workspace = true }
sdk = { workspace = true }
chat = { workspace = true }
tasks = { workspace = true }
identity = { workspace = true }
duckdns = { workspace = true }
gateway = { workspace = true }
inbox = { workspace = true }
automations = { workspace = true }
jobs = { workspace = true }
agent = { workspace = true }
runs = { workspace = true }
dispatch = { workspace = true }
tagging = { workspace = true }
dispatch-oracle = { workspace = true }
# host-side provider discovery: the dispatch worker runs the operator's locally
# installed executor CLIs (BYO), never any credential file.
capability-host = { workspace = true }
saga = { workspace = true }
pages = { workspace = true }
forge = { workspace = true }
# the forge module's wire types — the git smart-HTTP receive-pack bridge encodes
# ForgeMsg::PushRefs / ForgeQuery::HeadOf onto the actor lane (the ONE forge-specific
# route pair; every other route stays module-agnostic opaque json).
# the duckfs module registration plus digest-hex validation on the blob route.
files = { workspace = true }
# duckfs wire/path/object helpers used by the daemon's HTTP and workspace
# adapter surfaces without depending on the module adapter re-export.
duckfs-core = { workspace = true }
# the node-local op-receipt blob store (the http blob lane): op payloads staged
# at submit time, served back by digest. re-exported by `src/blobs.rs`.
blobstore = { workspace = true }
# the derived read-model tier: the actor materializes per-module fluent31
# indexes as blocks commit; /v1/index/* serves snapshot reads of them, and
# each module registers its `::index` mapper as its own view endpoint.
indexer = { workspace = true }
# the duckfs checkout/commit engine: the workspace RPC (/v1/fs/workspaces) drives
# it over an actor-lane `NodeApi` adapter, so the daemon manages checkouts with
# no self-dial. NOT a consensus-path crate — a client engine, OS-side only.
duckfs-client = { workspace = true }
# the workspace RPC decodes file-read replies (base64) off the actor lane.
base64 = { workspace = true }
# forge attribution emails include a bounded sha256-derived suffix so distinct
# committed agent ids cannot collapse onto the same synthetic address.
sha2 = { workspace = true }
# the op-frame codec. `/v1/submit/frame` VERIFIES an already-signed frame before
# it reaches any actor, and the embedded daemon takes the op's origin from that
# verification — never from a caller-supplied string. same codec every validator
# runs, so one definition of "who signed this op".
node = { workspace = true }
# the per-run agent session keypair: minted with the SAME ed25519 types
# `node::encode_frame` signs with (no second crypto stack, no hand-rolled key).
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }

commonware-runtime = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
async-trait = { workspace = true }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
# inflate a gzip-compressed git receive-pack request body (Content-Encoding: gzip).
flate2 = "1"
# the git upload-pack (clone/fetch) lane opens a forge repo READ-ONLY and builds
# the wanted oids' closure into a packfile. same vendored libgit2 forge builds,
# so the node stays self-contained (no host `git`); default-features drops the
# ssh/https transport forge doesn't use either.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
# the log subscriber every bin installs (src/log.rs): ONE reloadable filter over
# stderr + the ws-streamed LogRing. `reload` backs POST /v1/log-filter.
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
tokio = { version = "1", features = ["test-util"] }
# daemon_e2e spawns the real binary and needs isolated storage roots.
tempfile = "3"
# (duckfs-client and base64 are now direct deps above — daemon_e2e drives the
# `HttpNode` transport through them as the full-stack proof of the client
# transport, alongside the workspace RPC that uses them at runtime.)
