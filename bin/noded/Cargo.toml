[package]
name = "noded-bin"
edition.workspace = true
version.workspace = true

# the `ducktape-noded` binary: the app-facing node daemon process. Everything
# it serves — the actor lane, the axum /v1 router, the index/blob/stream lanes,
# the in-process testkit — is the `noded` LIBRARY (crates/noded); this package
# owns only the process shape: argv, the storage root, the genesis module set
# composed over native instances, the two runtimes, and the debug echo worker.
[[bin]]
name = "ducktape-noded"
path = "src/main.rs"

[dependencies]
noded = { path = "../../crates/noded" }
host = { workspace = true }
# the module composition catalog this composer draws its genesis selection from.
topology = { workspace = true }
sdk = { workspace = true }
node = { workspace = true }
statesync = { workspace = true }
indexer = { workspace = true }
# the genesis module set, composed over native instances in registry order.
agent = { workspace = true }
automations = { workspace = true }
chat = { workspace = true }
dispatch = { workspace = true }
files = { workspace = true }
forge = { workspace = true }
gateway = { workspace = true }
identity = { workspace = true }
inbox = { workspace = true }
pages = { workspace = true }
runs = { workspace = true }
saga = { workspace = true }
tagging = { workspace = true }
tasks = { workspace = true }
commonware-runtime = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# daemon_e2e spawns the real binary over http/ws and needs isolated storage
# roots plus the duckfs client transport as the full-stack proof of the wire.
base64 = { workspace = true }
duckfs-client = { workspace = true }
# the forge lanes are proven against a real libgit2 clone of the served repo.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
nettest = { path = "../../crates/testing/nettest" }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
