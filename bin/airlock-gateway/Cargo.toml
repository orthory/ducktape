[package]
name = "airlock-gateway"
edition.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "airlock-gateway"
path = "src/main.rs"

[dependencies]
airlock = { path = "../../crates/airlock", features = ["server"] }
anyhow = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros"] }
axum = "0.8"
