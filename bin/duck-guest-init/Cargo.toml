[package]
name = "duck-guest-init"
edition.workspace = true
version.workspace = true

# PID 1 inside a run's microVM. Kept dependency-light on purpose: it ships
# inside the guest rootfs, so every dependency is bytes in an image that boots
# a few hundred times a day, and code running as PID 1 with the workspace
# mounted is the least appealing place in the tree for a supply-chain surprise.
#
# NOT a dependency: sandbox-host. The vsock codec is shared by including that
# crate's `guest_proto.rs` source directly (see src/main.rs), which keeps one
# copy of the wire format without dragging tokio and tracing into PID 1.
[dependencies]
libc = "0.2"
# serde/serde_json feed the `#[path]`-included sandbox-host sources
# (guest_manifest.rs derives + parsing) — dependency scanners that only read
# this crate's own src/ see no use and misreport them.
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]

[[bin]]
name = "duck-guest-init"
path = "src/main.rs"
