[package]
name = "node-bin"
edition.workspace = true
version.workspace = true

# a runnable multi-process node: derives an ed25519 identity from a config seed,
# stands up a real `authenticated::discovery` encrypted TCP mesh to its peers,
# runs a live simplex Engine (via consensus::SimplexOrderer, over the REAL tokio
# runtime + discovery channels — NOT p2p::simulated) driving an OrderedNode over
# host::Host, and prints its evolving app-hash so a demo script can assert two
# OS processes converge over real sockets.
[[bin]]
name = "ducktape-node"
path = "src/main.rs"

[dependencies]
host = { workspace = true }
node = { workspace = true }
consensus = { workspace = true }
recovery = { workspace = true }
sdk = { workspace = true }
statesync = { workspace = true }
kv = { workspace = true }
directory = { workspace = true }
# the production module set: system infrastructure + every product module.
valset = { workspace = true }
governance = { workspace = true }
# the invite-accept verb drives governance ops through the local rpc.
# the no-downtime upgrade module + its wire surface (read_upgrade_state reads the
# committed boundary snapshot; the module itself is genesis-wired post-retrofit).
upgrade = { workspace = true }
saga = { workspace = true }
# the network-wide node-capability registry + its wire surface; the host-side
# provider discovery announces this node's installed executor CLIs into it.
capability = { workspace = true }
capability-host = { workspace = true }
# the task plane: recipe manifests + capability dispatch + its host worker.
dispatch = { workspace = true }
tagging = { workspace = true }
dispatch-oracle = { workspace = true }
forge = { workspace = true }
pages = { workspace = true }
chat = { workspace = true }
tasks = { workspace = true }
vaults = { workspace = true }
profiles = { workspace = true }
identity = { workspace = true }
automations = { workspace = true }
inbox = { workspace = true }
files = { workspace = true }
# duckfs reusable core and disk scratch helpers; the `files` crate above remains
# the consensus module adapter.
duckfs-core = { workspace = true }
duckfs-disk = { workspace = true }
# the node-local op-receipt blob store shared with forge + the files module.
blobstore = { workspace = true }
jobs = { workspace = true }
agent = { workspace = true }
runs = { workspace = true }
reactor = { workspace = true }
# the staged node-driven WireGuard plane: the reachability orchestrator runs
# on its own plain-tokio thread (mirroring the app-surface split) behind the
# `wireguard_listen` node.toml key; wireguard-upgrade/-effect supply the
# endpoint types and the phase-A fake effect it drives.
reachability = { workspace = true }
# the coordinator-auth credential types: `coord.cap` is the private-mode
# admission token a node persists beside its descriptor (minted by a genesis
# validator via `mint_coord_cap`, presented on each rendezvous request).
nat-traversal = { workspace = true }
wireguard-upgrade = { workspace = true }
wireguard-effect = { workspace = true }
# the voice hub's transport seam: huddle audio rides data-plane datagrams over
# the dedicated CHANNEL_VOICE mesh lane (src/voice.rs owns the mesh arm).
data-plane = { workspace = true }
# the overlay routing seam (ADR 2026-07-07-userspace-overlay-net): the mesh's
# runtime context is wrapped so dial/bind route overlay ULAs by address.
overlay-net = { workspace = true }
futures = "0.3"
serde_json = { workspace = true }
# compact, url-safe text encoding for the invite blob (replaces hex-of-toml).
base64 = "0.22"
# the http/ws app surface, shared with the embedded daemon: NodeCommand lane,
# axum router, and serve() — this binary only owns the pump-side of the lane.
noded = { path = "../noded" }
# the derived read-model tier: bin/node reuses noded's store construction and
# /v1/index/* + /v1/blocks lanes, folds each sealed block (ops + explorer row)
# in its drain/replay, and re-derives views from verified state at
# sync/recovery boundaries.
indexer = { workspace = true }
# the app-surface thread runs plain tokio (axum); the node itself stays on
# commonware's runner. the promoted-validator boot catch-up also uses Tokio's
# bounded mutex/timeout around the temporary statesync client; `signal` drives
# the SIGTERM/SIGINT graceful-checkpoint arm of the run loop.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal"] }

commonware-runtime = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
commonware-consensus = { workspace = true }
commonware-storage = { workspace = true }
commonware-utils = { workspace = true }
commonware-codec = { workspace = true }

serde = { workspace = true }
toml = "0.8"
# identity keygen entropy (`Signer::random`).
rand = "0.8"
# `user.key` v2 codec (src/userkey.rs): mnemonic <-> seed encoding, argon2id
# KEK derivation, and the XChaCha20-Poly1305 AEAD wrapping it at rest.
bip39 = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
# stderr tracing for the p2p/consensus internals (RUST_LOG=commonware_p2p=debug).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# the process-level e2e suite (tests/) spawns REAL `ducktape-node` binaries and
# drives them through the rpc with TYPED interface-crate payloads — payload
# drift fails to compile instead of rotting silently like the old bash demo.
[dev-dependencies]
async-trait = { workspace = true }
tempfile = "3"
# voice::overlay_e2e stands two userspace WireGuard overlay stacks up on
# loopback (the crates/system/overlay-net/tests/loopback_pair harness shape) to
# prove huddle media crosses the REAL overlay headless — this supplies the WG
# interface config types; the boringtun crypto rides overlay-net (a dep above).
defguard_wireguard_rs = { workspace = true }
# the phase-3 proof: duckfs_client_e2e drives the checkout/commit engine (as a
# library, over each node's real http surface) across a two-validator cluster.
duckfs-client = { workspace = true }
# coordinated_invite_cli seeds a signed mesh-state.json so `invite` bundles
# member fronts, building the persisted adverts with the same crates the node
# already depends on (reachability::store + wireguard-upgrade advert types +
# commonware's Sha256) — all normal [dependencies] above, so the integration
# tests see them without a redundant [dev-dependencies] re-listing.
