[package]
name = "node-bin"
edition.workspace = true
version.workspace = true

# a runnable multi-process node: derives an ed25519 identity from a config seed,
# stands up a real `authenticated::discovery` encrypted TCP mesh to its peers,
# runs a live simplex Engine (via consensus::SimplexOrderer, over the REAL tokio
# runtime + discovery channels — NOT p2p::simulated) driving an OrderedNode over
# host::Host, and prints its evolving app-hash so a demo script can assert two
# OS processes converge over real sockets.
[[bin]]
name = "ducktape-node"
path = "src/main.rs"

[dependencies]
host = { workspace = true }
node = { workspace = true }
consensus = { workspace = true }
recovery = { workspace = true }
sdk = { workspace = true }
statesync = { workspace = true }
kv = { workspace = true }
kv-interface = { workspace = true }
directory = { workspace = true }
directory-interface = { workspace = true }
# the production module set: system infrastructure + every product module.
valset = { workspace = true }
valset-interface = { workspace = true }
governance = { workspace = true }
# the invite-accept verb drives governance ops through the local rpc.
governance-interface = { workspace = true }
# the no-downtime upgrade module + its wire surface (read_upgrade_state reads the
# committed boundary snapshot; the module itself is genesis-wired post-retrofit).
upgrade = { workspace = true }
upgrade-interface = { workspace = true }
saga = { workspace = true }
forge = { workspace = true }
document = { workspace = true }
chat = { workspace = true }
tasks = { workspace = true }
vaults = { workspace = true }
profiles = { workspace = true }
automations = { workspace = true }
inbox = { workspace = true }
files = { workspace = true }
memory = { workspace = true }
jobs = { workspace = true }
agent = { workspace = true }
agent-oracle = { workspace = true }
reactor = { workspace = true }
futures = "0.3"
serde_json = { workspace = true }
# compact, url-safe text encoding for the invite blob (replaces hex-of-toml).
base64 = "0.22"
# the http/ws app surface, shared with the embedded daemon: NodeCommand lane,
# axum router, and serve() — this binary only owns the pump-side of the lane.
noded = { path = "../noded" }
# the app-surface thread runs plain tokio (axum); the node itself stays on
# commonware's runner.
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

commonware-runtime = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
commonware-consensus = { workspace = true }
commonware-utils = { workspace = true }
commonware-codec = { workspace = true }

serde = { workspace = true }
toml = "0.8"
# identity keygen entropy (`Signer::random`).
rand = "0.8"
# stderr tracing for the p2p/consensus internals (RUST_LOG=commonware_p2p=debug).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# the process-level e2e suite (tests/) spawns REAL `ducktape-node` binaries and
# drives them through the rpc with TYPED interface-crate payloads — payload
# drift fails to compile instead of rotting silently like the old bash demo.
[dev-dependencies]
chat-interface = { workspace = true }
tempfile = "3"
