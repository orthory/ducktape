# node 1 — dials node 0 to join the mesh. binds a DISTINCT port and points
# bootstrapper_addr at node 0's listen addr. namespace + peer_seeds identical.
id = 1
listen = "127.0.0.1:52201"
namespace = "ducktape-demo"
peer_seeds = [0, 1]
bootstrapper_addr = "127.0.0.1:52200"
storage_dir = "/tmp/ducktape-node-1"
# consensus signature scheme — GENESIS-WIDE, every node must match. "ed25519"
# (default) or "bls-multisig" (dev bls secrets derived from the same peer_seeds).
# consensus_scheme = "ed25519"
