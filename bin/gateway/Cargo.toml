[package]
name = "gateway"
edition.workspace = true
version.workspace = true

# a runnable single-host gateway: owns ONE embedded `host::Host` on a dedicated
# actor thread (the host is deliberately non-Send) and exposes it to external
# clients over http + websocket — POST /v1/submit (one msg = one block), POST
# /v1/query (read committed state), GET /v1/status (app-hash + module roots),
# GET /v1/ws (a block-finalized event stream). the web build of the ducktape
# app talks to this; the tauri build embeds the same actor in-process instead.
[[bin]]
name = "ducktape-gateway"
path = "src/main.rs"

[dependencies]
host = { workspace = true }
sdk = { workspace = true }
chat = { workspace = true }
tasks = { workspace = true }
document = { workspace = true }
agent = { workspace = true }
forge = { workspace = true }

commonware-runtime = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
