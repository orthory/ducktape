[package]
name = "mcp-bin"
edition.workspace = true
version.workspace = true

# `ducktape-mcp`: the agent tool plane. a stdio MCP server the runner CLI
# (codex / claude) spawns beside the agent's sandbox, giving the run typed
# read/write access to Ducktape state over the node's existing http surface.
#
# it is spawned by the RUNNER, not by the agent — so under codex's
# `--sandbox workspace-write` (which disables network) it is the only door the
# run has onto the node at all. its whole identity arrives in two env vars the
# provisioner sets (DUCKTAPE_NODE, DUCKTAPE_RUN_AGENT); everything else about
# the agent's grant — owner, allowed_actions, ResourceCaps — is read back from
# the COMMITTED registry, so a grant can never drift from what consensus holds.
[[bin]]
name = "ducktape-mcp"
path = "src/main.rs"

[dependencies]
# the wire surfaces the tools speak. types-only imports: every module publishes
# its payload/query/reply shapes at its crate root, so this binary builds ops
# and queries by CONSTRUCTION rather than by hand-writing json that could drift
# from the module's enum.
agent = { workspace = true }
chat = { workspace = true }
tasks = { workspace = true }
pages = { workspace = true }
forge = { workspace = true }
# `AgentRecord.owner` is a `SagaOrigin` — read back for `ducktape_whoami`.
saga = { workspace = true }
# the session lane: every WRITE is a `RunsMsg::AgentAction` op, signed by this
# run's session key and validated in CONSENSUS against the agent's committed
# grant. the runs module — not this binary — is the gate.
runs = { workspace = true }
sdk = { workspace = true }
# `encode_frame`: an op frame's origin IS its verified public key, so a signed
# AgentAction proves which run it came from. this is the whole reason the write
# plane is trustworthy — the frameless `/v1/submit` origin string is DISCARDED
# by the real node.
node = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
# blocking http against the local node. one request per tool call, on the stdio
# loop's own thread — an MCP server is a strictly serial request/response actor,
# so there is no concurrent work to schedule and no async runtime to pay for.
reqwest = { workspace = true, features = ["blocking"] }
base64 = { workspace = true }

[dev-dependencies]
# the e2e stands a REAL node (agent registry + saga + tasks) behind
# `noded::router` on a local listener, then drives
# `env!(CARGO_BIN_EXE_ducktape-mcp)` against it as a subprocess over stdio — the
# same shape as bin/fs's cli_e2e.
noded = { path = "../noded" }
host = { workspace = true }
# the stand-in actor answers the signed-frame lane exactly as both real binaries
# do — decode + VERIFY, and the verified signer becomes the block's origin.
node = { workspace = true }
# the e2e drives the session lane end to end, so it needs the modules the lane
# touches (runs + its collaborators) and the dispatch plane the run rides.
dispatch = { workspace = true }
tagging = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
futures = "0.3"
tempfile = { workspace = true }
