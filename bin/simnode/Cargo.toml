[package]
name = "simnode"
edition.workspace = true
version.workspace = true

# the deterministic scenario node: serves the SAME /v1 http+ws wire as noded
# (the router is literally noded's), but block production is test-controlled.
# submits are HELD until a /sim/step commits them, a logical clock replaces
# wall time, and a /sim control lane scripts the node from the outside —
# concurrent-writer blocks, persona switches (local daemon vs networked
# validator wire shapes), stepwise oracle drains. dev/test tool only; it is
# never part of a release.
[[bin]]
name = "ducktape-simnode"
path = "src/main.rs"

[dependencies]
# the host-side qmdb store handle injected into disk-backed modules.
statesync = { workspace = true }
host = { workspace = true }
sdk = { workspace = true }
chat = { workspace = true }
tasks = { workspace = true }
identity = { workspace = true }
duckdns = { workspace = true }
gateway = { workspace = true }
inbox = { workspace = true }
automations = { workspace = true }
jobs = { workspace = true }
agent = { workspace = true }
runs = { workspace = true }
dispatch = { workspace = true }
tagging = { workspace = true }
saga = { workspace = true }
pages = { workspace = true }
forge = { workspace = true }
files = { workspace = true }
# the opt-in `--with-valset` governance genesis: the KV store, the membership
# registry, the sole authorized author of valset change, and the upgrade
# coordinator whose registration makes the host-injected boundary tick ride.
kv = { workspace = true }
valset = { workspace = true }
clients = { workspace = true }
governance = { workspace = true }
upgrade = { workspace = true }
# the node-local op-receipt blob store shared with forge + the files module.
blobstore = { workspace = true }
# variable-length hex decode for the `hex:` origin escape and `--with-valset`
# genesis keys (raw ed25519 bytes the JSON-string origin lane cannot express).
duckfs-core = { workspace = true }
# the sim installs the SAME subscriber the real node does (noded::log), so a
# scenario sees the module breadcrumbs a wasm guest has no other way to emit.
noded = { path = "../noded" }
tracing = { workspace = true }
# the op-frame codec: `node::decode_frame` verifies a signed frame's signature
# and yields the VERIFIED signer as the op origin — the SAME function every
# validator and the embedded daemon use, so the sim's `/v1/submit/frame` lane
# authenticates authorship identically (also available to the frame/batch tests
# for composing frames via `node::encode_frame`).
node = { workspace = true }
# the durable block index — /v1/blocks and /v1/index/* read it, the sim actor
# feeds it block-by-block exactly like the real daemons.
indexer = { workspace = true }

commonware-runtime = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[dev-dependencies]
# sim_e2e spawns the real binary and needs isolated storage roots.
tempfile = "3"
# core_scenarios signs identity member-consent certificates.
commonware-cryptography = { workspace = true }
