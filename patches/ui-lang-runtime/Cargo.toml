# The published ducktape-ui `ui-lang-runtime` source at the pinned rev
# (a64eb5f7), standalone-ified: workspace-inherited manifest fields are
# spelled out, the intra-workspace `ui-lang-template` dependency points at
# the same git pin, and the workspace lint table is dropped. The one source
# change is the macOS tray guard in `src/tray.rs` — see the `[patch]` entry
# in the root Cargo.toml for why this copy exists and when it goes away.
[package]
name = "ui-lang-runtime"
version = "0.1.0"
edition = "2024"
description = "Native iced runtime and test support for generated Ice applications"
homepage = "https://github.com/byeongsu-hong/ducktape-ui"
license = "MIT"
repository = "https://github.com/byeongsu-hong/ducktape-ui"
rust-version = "1.88"

[features]
default = ["full-runtime", "test-runtime"]
full-runtime = ["data-grid"]
data-grid = []
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
x11 = ["iced/x11", "thread-pool"]
wayland = ["iced/wayland", "thread-pool"]
thread-pool = ["iced/thread-pool"]
test-runtime = [
    "dep:iced_test",
    "dep:iced_tiny_skia",
    "dep:png",
    "thread-pool",
    "tiny-skia",
    "wgpu",
    "x11",
]

[dependencies]
accesskit = "=0.24.1"
ouroboros = "0.18"
rustc-hash = "2.0"
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "canvas", "qr_code"] }
stacker = "0.1"
iced_test = { version = "=0.14.0", optional = true }
iced_tiny_skia = { version = "=0.14.0", default-features = false, optional = true }
png = { version = "0.18", optional = true }
ui-lang-template = { git = "https://github.com/byeongsu-hong/ducktape-ui.git", rev = "a64eb5f70c7cbd97136ac54b42c6ea0409c2d866", version = "=0.1.0" }
serde_json = "1"
unicode-segmentation = "1"
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "=0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "=0.32.0"

[dev-dependencies]
dhat = "=0.3.3"
serde_json = "1"
stats_alloc = "0.1.10"
