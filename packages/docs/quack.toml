schema = 1
package = "org.ducktape.docs"
version = "0.1.0"
harness = "docs-harness"
golden = "sha256:25deb1311a5046d5f45df33c9b6b58aeb029d19eb8db6ef75aa81c5ba49e3763"

[requires]
protocol_min = 1
modules = ["agent", "runs", "jobs", "dispatch", "capability"]
capabilities = ["codex"]

# v1 modules are `native`: the code ships in the node binary, so `artifact`/
# `abi`/`hash` are omitted. `logical` ids map to concrete network module ids at
# install; every cross-reference below is by logical id.
[[modules]]
logical = "pages"
default_id = "pages"
kind = "native"

[[modules]]
logical = "docs-harness"
default_id = "docs-harness"
kind = "native"

[[prompts]]
logical = "docs_editor_prompt"
path = "prompts/docs-editor.md"
hash = "sha256:3402716938239813b336ad21b312832dc0c86ce8645da90e94d075fc39b7cca3"

[[actions]]
tag = "pages.comment.add"
owner = "docs-harness"
schema = "actions/pages.comment.add.schema.json"
schema_hash = "sha256:214faa630ea4074d630b97818255a69565b4f76bd0924adca9724511fef80614"

[[actions]]
tag = "pages.block.update_text"
owner = "docs-harness"
schema = "actions/pages.block.update_text.schema.json"
schema_hash = "sha256:4bcb4bb285e3de579242392f7b0385e648eae00bd0f0552094dc5583b81eee02"

[[actions]]
tag = "pages.thread.resolve"
owner = "docs-harness"
schema = "actions/pages.thread.resolve.schema.json"
schema_hash = "sha256:b20284cbc0336ae463c5c888bfe28a9fb065ac225a259cd7a656572697a55973"

[[agents]]
id = "docs.editor"
display_name = "Docs Editor"
prompt = "docs_editor_prompt"
capability = "codex"
actions = ["pages.comment.add", "pages.block.update_text", "pages.thread.resolve"]
status = "active"

[[engagements]]
source = "pages"
event = "comment_added"
agent = "docs.editor"
policy = "mention_or_assigned"

[install]
register_modules = true
seed_state = true
register_agents = true
register_actions = true
wire_hooks = true
enable_jobs = true
run_harness = true

[uninstall]
remove_hooks = true
pause_agents = true
unregister_actions = true
pending_runs = "drain"
user_data = "preserve"
package_state = "tombstone"
